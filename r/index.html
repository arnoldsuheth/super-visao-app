<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Lojas visitadas, notas, ranking e pendências da semana e do mês.">
<meta property="og:type" content="website"><meta property="og:site_name" content="SUPER VISÃO · Arnold Suheth"><meta property="og:title" content="Relatório das lojas · Indus"><meta property="og:description" content="Lojas visitadas, notas, ranking e pendências da semana e do mês.">
<meta name="robots" content="noindex,nofollow"><title>Relatório das lojas · Indus</title>
<style>
:root{--or:#f97316;--ink:#17181c;--gr:#7a7f8a;--ln:#e6e6e9;--bg:#f7f7f8;--ok:#16a34a;--okl:#e8f8ee;--at:#d98a00;--atl:#fff6df;--ru:#dc2626;--rul:#fdeaea}
*{box-sizing:border-box}body{margin:0;background:#efeff2;color:var(--ink);font:15px/1.45 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:860px;margin:0 auto;background:#fff;min-height:100vh;border-top:5px solid var(--or);padding:22px 18px 40px}
.eb{font:700 11px system-ui;letter-spacing:.14em;color:var(--or);margin:0}
h1{font-size:clamp(26px,6vw,34px);margin:4px 0 2px;letter-spacing:-.5px}.sub{color:var(--gr);margin:0 0 14px;font-size:14px}
.frase{font-size:15.5px;margin:0 0 14px}
.tabs{display:flex;gap:8px;margin:6px 0 16px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tabs button small{display:block;font:600 11px system-ui;opacity:.7}.tabs button{line-height:1.2;flex:0 0 auto;border:1px solid var(--ln);background:#fff;border-radius:999px;padding:10px 18px;font:700 14px system-ui;color:var(--gr);min-height:44px;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;background:var(--bg);border-radius:14px;padding:14px}
.nums b{display:block;font-size:clamp(22px,5vw,30px);font-variant-numeric:tabular-nums}.nums small{color:var(--gr);font-size:12px}
.sem{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 18px}.sem button{text-align:center;border-radius:12px;padding:10px 6px;font:700 13px system-ui;border:2px solid transparent;cursor:pointer;min-height:76px;transition:transform .15s,border-color .2s}.sem button:active{transform:scale(.97)}.sem button small{display:block;font:600 10.5px system-ui;opacity:.75;margin-top:2px}.sem button.sel{border-color:currentColor;box-shadow:0 3px 10px rgba(0,0,0,.08)}
.limpa{margin-left:8px;border:1px solid var(--ln);background:#fff;border-radius:999px;padding:4px 10px;font:700 11px system-ui;color:var(--ink);letter-spacing:0;cursor:pointer}
.sem b{display:block;font-size:22px}.ok{background:var(--okl);color:var(--ok)}.at{background:var(--atl);color:var(--at)}.ur{background:var(--rul);color:var(--ru)}
h2{font-size:13px;letter-spacing:.12em;color:var(--or);margin:22px 0 10px}
.podio{position:relative;border-radius:16px;padding:16px;background:linear-gradient(135deg,#fff7e8,#fff);border:1px solid #f6dfb8;display:flex;gap:14px;align-items:center;overflow:hidden}
.podio svg{width:64px;height:64px;flex:0 0 auto;filter:drop-shadow(0 4px 8px #d4a01755)}
.podio .tl{font:700 11px system-ui;letter-spacing:.1em;color:#b8860b}.podio b{display:block;font-size:18px}.podio small{color:var(--gr)}
.rk{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--ln)}.rk:last-child{border:0}
.pos{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:800 12px system-ui;color:#fff;background:#c9ccd2;flex:0 0 auto}
.pos.p1{background:#d4a017}.pos.p2{background:#9aa3ad}.pos.p3{background:#b87333}
.rk .n{flex:1;min-width:0}.rk .n b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rk .n small{color:var(--gr);font-size:12px}
.bar{height:7px;border-radius:5px;background:var(--bg);margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;width:0;border-radius:5px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.rk .nt{font:800 16px system-ui;font-variant-numeric:tabular-nums;width:40px;text-align:right}
.loja{border:1px solid var(--ln);border-radius:14px;margin:10px 0;overflow:hidden;background:#fff}
.lh{display:flex;align-items:center;gap:10px;padding:13px 14px;width:100%;border:0;background:none;text-align:left;font:inherit;color:inherit;cursor:pointer;min-height:56px}
.lh .st{width:4px;align-self:stretch;border-radius:3px}.lh b{font-size:15px;display:block}.lh small{color:var(--gr);font-size:12.5px}
.nota{margin-left:auto;margin-right:2px;font:800 14px system-ui;padding:5px 10px;border-radius:9px;font-variant-numeric:tabular-nums}
.abrir{display:flex;align-items:center;gap:4px;background:var(--or);color:#fff;border-radius:999px;padding:6px 10px 6px 12px;font:800 12px system-ui;flex:0 0 auto;box-shadow:0 2px 6px #f9731655}.chev{transition:transform .25s;flex:0 0 auto}.loja.on .chev{transform:rotate(180deg)}.loja.on .abrir{background:var(--ink);box-shadow:none}
@media (max-width:420px){.abrir .tx{display:none}.abrir{padding:7px}}
.det{display:none;padding:0 16px 14px 28px;font-size:14px}.loja.on .det{display:block;animation:abre .3s ease}
.det p{margin:10px 0 3px;font:700 11px system-ui;letter-spacing:.08em}.det ul{margin:0;padding-left:18px}.det li{margin:3px 0}.det i{color:var(--gr)}
.prox{background:#fff4ea;border-radius:14px;padding:14px 16px;margin-top:18px}.prox b{display:block}.prox small{color:var(--gr)}
.rod{color:var(--gr);font-size:12px;margin-top:26px;text-align:center}
.rv{opacity:0;transform:translateY(14px);transition:opacity .5s ease,transform .5s ease}.rv.in{opacity:1;transform:none}
@keyframes abre{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:9}
.erro{padding:30px 10px;text-align:center;color:var(--gr)}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}.bar i{transition:none}}
</style></head><body>
<canvas id="fx" aria-hidden="true"></canvas>
<main class="wrap" id="app"><p class="erro">Carregando o relatório…</p></main>
<script>
/* Relatório das lojas para a administração (23/11/2026). Só leitura: os dados vêm do SUPER VISÃO. */
const URL_DB='https://mgqwzaizkllkqqqbbcna.supabase.co',KEY='sb_publishable_nBJrSlD-qcQg26UIhVCWkQ_d9_fZCPc';
let id=new URLSearchParams(location.search).get('r');const K=new URLSearchParams(location.search).get('k');
const $=s=>document.querySelector(s),RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n1=n=>Number(n||0).toFixed(1).replace('.',',');
const MES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'],SEM=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const per=(a,b)=>a.slice(0,7)===b.slice(0,7)?`${+a.slice(8)} a ${+b.slice(8)} de ${MES[+b.slice(5,7)-1]} de ${b.slice(0,4)}`:`${a.slice(8)}/${a.slice(5,7)} a ${b.slice(8)}/${b.slice(5,7)}/${b.slice(0,4)}`;
const dia=iso=>SEM[new Date(iso+'T12:00:00Z').getUTCDay()]+', '+iso.slice(8)+'/'+iso.slice(5,7);
const corN=n=>n>=8?'ok':n>=6?'at':'ur';
const TROFEU='<svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9a6"/><stop offset=".5" stop-color="#e8b33a"/><stop offset="1" stop-color="#a8740f"/></linearGradient></defs><path d="M18 8h28v12c0 9-6 16-14 17-8-1-14-8-14-17z" fill="url(#g)"/><path d="M18 12H8c0 9 5 14 11 15M46 12h10c0 9-5 14-11 15" fill="none" stroke="#e8b33a" stroke-width="4"/><rect x="28" y="36" width="8" height="10" fill="#c9921f"/><path d="M20 46h24l3 10H17z" fill="url(#g)"/><path d="M32 14l3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z" fill="#fff8dc" opacity=".9"/></svg>';
let D=null,aba=null,filtro=null;
async function carregar(){if(!id&&!K){$('#app').innerHTML='<p class="erro">Link incompleto. Peça o link de novo ao Arnold.</p>';return}
 try{const r=await fetch(URL_DB+'/rest/v1/rpc/'+(K?'sv_ler_curto':'sv_ler'),{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(K?{p_k:K}:{p_id:id})});const j=await r.json();
  if(!j||j.tipo!=='adm')throw 0;D=j;aba=(j.dados.semanas&&j.dados.semanas.length)?'s'+(j.dados.atual??0):'mes';desenhar(true)}catch(e){$('#app').innerHTML='<p class="erro">Não foi possível abrir o relatório agora. Tente de novo em instantes.</p>'}}
function desenhar(primeira){const S=D.dados.semanas||[],eS=aba!=='mes',P0=eS?S[+aba.slice(1)]:D.dados.mes,P={...P0,visitas:P0.visitas||(D.dados.mes.visitas||[]).filter(v=>v.data>=P0.ini&&v.data<=P0.fim)},top=P.ranking[0],max=10;
 const frase=!P.visitadas?'Sem vistorias registradas neste período.':(P.atencao+P.urgente===0?'Tudo em ordem nas lojas visitadas.':`${P.bem} de ${P.visitadas} lojas visitadas estão bem e ${P.atencao+P.urgente} ${P.atencao+P.urgente===1?'precisa':'precisam'} de ação.`);
 $('#app').innerHTML=`<p class="eb">INDUS.CORP · SUPERVISÃO DE LOJAS</p><h1>${eS?'Relatório da Semana '+P.n:'Relatório do mês'}</h1>
 <p class="sub">${per(P.ini,P.fim)} · ${esc(D.dados.por||'')}</p>
 <div class="tabs" role="group" aria-label="Período">${S.map((w,k)=>`<button data-a="s${k}" aria-pressed="${aba==='s'+k}">Semana ${w.n}<small>${w.ini.slice(8)}–${w.fim.slice(8)}</small></button>`).join('')}<button data-a="mes" aria-pressed="${aba==='mes'}">Mês<small>${MES[+P.fim.slice(5,7)-1].slice(0,3)}</small></button></div>
 <p class="frase rv">${esc(frase)}</p>
 <div class="nums rv"><span><b data-c="${P.visitadas}" data-s=" de ${P.lojas}">0</b><small>lojas visitadas</small></span><span><b data-c="${P.media}" data-d="1">0</b><small>nota média</small></span><span><b data-c="${P.resolvidas}">0</b><small>pendências resolvidas</small></span></div>
 <div class="sem rv" role="group" aria-label="Filtrar lojas">${[['bem','ok','bem'],['atencao','at','atenção'],['urgente','ur','urgente']].map(([k,c,n])=>`<button class="${c}${filtro===k?' sel':''}" data-f="${k}" aria-pressed="${filtro===k}"><b data-c="${P[k]}">0</b>${n}<small>${filtro===k?'mostrando ✕':'toque para ver'}</small></button>`).join('')}</div>
 ${top?`<h2 class="rv">${eS?'MELHOR LOJA DA SEMANA '+P.n:'MELHOR LOJA DO MÊS'}</h2><div class="podio rv" id="podio">${TROFEU}<div><span class="tl">1º LUGAR</span><b>${esc(top.loja)}</b><small>nota ${n1(top.nota)} · ${top.pend?top.pend+(top.pend===1?' pendência':' pendências'):'sem pendências'}</small></div></div>`:''}
 <h2 class="rv">RANKING</h2><div class="rv">${P.ranking.map((r,i)=>`<div class="rk"><span class="pos ${i<3?'p'+(i+1):''}">${i+1}</span><span class="n"><b>${esc(r.loja)}</b><small>${r.pend?r.pend+(r.pend===1?' pendência':' pendências'):'sem pendências'}${r.visitas>1?' · média de '+r.visitas+' visitas':''}</small><span class="bar"><i data-w="${r.nota/max*100}" style="background:var(--${corN(r.nota)})"></i></span></span><span class="nt" style="color:var(--${corN(r.nota)})">${n1(r.nota)}</span></div>`).join('')}</div>
 <h2 class="rv" id="visitas">${filtro?`VISITAS · ${filtro==='bem'?'BEM':filtro==='atencao'?'ATENÇÃO':'URGENTE'} <button class="limpa" data-f="${filtro}">mostrar todas</button>`:'VISITAS · toque em “Ver tudo” para abrir'}</h2>${(filtro?P.visitas.filter(v=>v.status===filtro):P.visitas).map((v,i)=>{const cor=v.status==='bem'?'ok':v.status==='atencao'?'at':'ur';return `<div class="loja rv${filtro?' on':''}"><button class="lh" aria-expanded="${!!filtro}"><span class="st" style="background:var(--${cor})"></span><span><b>${esc(v.loja)}</b><small>${dia(v.data)} · ${v.atencao.length+v.urgente.length?(v.atencao.length+v.urgente.length)+' pontos para corrigir':'tudo em ordem'}</small></span><span class="nota ${cor}">${n1(v.nota)}</span><span class="abrir"><span class="tx">${filtro?'Fechar':'Ver tudo'}</span><svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span></button>
  <div class="det">${v.urgente.length?`<p style="color:var(--ru)">URGENTE</p><ul>${v.urgente.map(x=>`<li>${esc(x.txt)}${x.com?` <i>(${esc(x.com)})</i>`:''}</li>`).join('')}</ul>`:''}
  <p style="color:var(--at)">ATENÇÃO</p>${v.atencao.length?`<ul>${v.atencao.map(x=>`<li>${esc(x.txt)}${x.com?` <i>(${esc(x.com)})</i>`:''}</li>`).join('')}</ul>`:'<i>Nada a corrigir</i>'}
  <p style="color:var(--ok)">POSITIVO</p>${v.pos.length?esc(v.pos.join(', ')):'<i>Sem pontos positivos</i>'}
  ${v.obs?`<p style="color:var(--gr)">OBSERVAÇÃO</p><i>${esc(v.obs)}</i>`:''}</div></div>`}).join('')}
 ${P.naoVisitadas.length?`<div class="prox rv"><b>Lojas que ainda não foram visitadas</b><small>${esc(P.naoVisitadas.join(', '))}</small></div>`:''}
 <p class="rod">Atualizado em ${new Date(D.atualizado).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})} · Indus.corp · Uso interno</p>`;
 document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{if(aba!==b.dataset.a){aba=b.dataset.a;filtro=null;desenhar(true)}});
 document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filtro=filtro===b.dataset.f?null:b.dataset.f;desenhar(false);if(filtro)setTimeout(()=>$('#visitas').scrollIntoView({behavior:'smooth',block:'start'}),80)});
 const on=document.querySelector('.tabs [aria-pressed=true]');if(on)on.scrollIntoView({inline:'center',block:'nearest'});
 document.querySelectorAll('.lh').forEach(b=>b.onclick=()=>{const l=b.parentNode;l.classList.toggle('on');const on=l.classList.contains('on');b.setAttribute('aria-expanded',on);const tx=b.querySelector('.tx');if(tx)tx.textContent=on?'Fechar':'Ver tudo'});
 animar(primeira);
}
// efeitos: cartões surgindo, números contando, barras enchendo e troféu com confete
function animar(primeira){const els=[...document.querySelectorAll('.rv')];
 if(RM||!primeira){els.forEach(e=>e.classList.add('in'));conta(true);document.querySelectorAll('.bar i').forEach(i=>i.style.width=i.dataset.w+'%');return}
 els.forEach((e,i)=>setTimeout(()=>e.classList.add('in'),60+i*70));setTimeout(()=>conta(false),250);
 setTimeout(()=>document.querySelectorAll('.bar i').forEach((i,k)=>setTimeout(()=>i.style.width=i.dataset.w+'%',k*90)),500);
 setTimeout(()=>{const p=$('#podio');if(p)confete(p)},900);
 setTimeout(()=>{els.forEach(e=>e.classList.add('in'));document.querySelectorAll('.bar i').forEach(i=>i.style.width=i.dataset.w+'%')},2500)}
function conta(ja){document.querySelectorAll('[data-c]').forEach(el=>{const fim=+el.dataset.c,dec=+(el.dataset.d||0),suf=el.dataset.s||'',t0=performance.now(),dur=1100;
 const txt=v=>(dec?v.toFixed(dec).replace('.',','):Math.round(v))+suf;const f=t=>{const k=ja?1:Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=txt(fim*e);if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f);
  setTimeout(()=>{el.textContent=txt(fim)},dur+200)})}
function confete(el){const c=$('#fx'),g=c.getContext('2d'),r=devicePixelRatio||1;c.width=innerWidth*r;c.height=innerHeight*r;g.scale(r,r);
 const b=el.getBoundingClientRect(),x0=b.left+50,y0=b.top+40,cores=['#f97316','#e8b33a','#16a34a','#ffd76a','#ff7a74','#60a5fa'];
 const P=Array.from({length:90},()=>({x:x0,y:y0,vx:(Math.random()-.5)*9,vy:-Math.random()*9-3,s:4+Math.random()*5,c:cores[Math.random()*cores.length|0],r:Math.random()*6,vr:(Math.random()-.5)*.3,l:90+Math.random()*40}));
 (function q(){g.clearRect(0,0,innerWidth,innerHeight);let vivo=0;for(const p of P){if(p.l<=0)continue;vivo++;p.l--;p.vy+=.28;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;g.save();g.translate(p.x,p.y);g.rotate(p.r);g.globalAlpha=Math.min(1,p.l/30);g.fillStyle=p.c;g.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);g.restore()}
  if(vivo)requestAnimationFrame(q);else g.clearRect(0,0,innerWidth,innerHeight)})();
 el.animate([{transform:'scale(.96)'},{transform:'scale(1.03)'},{transform:'scale(1)'}],{duration:600,easing:'ease-out'})}
carregar();
</script></body></html>
