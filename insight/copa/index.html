<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Copa · Equipes e robôs</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#07070b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Inter",Segoe UI,Roboto,Arial,sans-serif;padding-bottom:40px}
header{padding:24px 18px 8px;text-align:center}header h1{font-size:22px;font-weight:900;letter-spacing:.02em}header p{opacity:.6;font-size:13px;margin-top:4px}
.div{max-width:980px;margin:22px auto 0;padding:0 14px}
.div h2{font-size:12px;letter-spacing:.24em;font-weight:900;display:flex;align-items:center;gap:10px;margin-bottom:12px}.div h2::after{content:"";flex:1;height:1px;background:currentColor;opacity:.3}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.eq{position:relative;border-radius:20px;padding:14px 10px 12px;text-align:center;cursor:pointer;overflow:hidden;border:1px solid rgba(255,255,255,.08);background:#0f0f16;transition:transform .2s}
.eq:active{transform:scale(.97)}
.eq::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,var(--c1),transparent 70%);opacity:.35}
.eq svg.em{position:relative;width:132px;height:156px;overflow:visible;filter:drop-shadow(0 8px 14px rgba(0,0,0,.6))}
.eq b{position:relative;display:block;font-size:14px;margin-top:6px}.eq small{position:relative;display:block;font-size:11px;opacity:.6;margin-top:2px}
.eq .rb{position:relative;display:flex;justify-content:center;gap:4px;margin-top:8px}.eq .rb svg{width:30px;height:30px}
.eq.voce{border:2px solid transparent;background:linear-gradient(#0f0f16,#0f0f16) padding-box,linear-gradient(90deg,#1E3A8A,#3B82F6,#22D3EE) border-box}
.tg{position:absolute;top:8px;left:8px;z-index:2;font-size:9px;font-weight:900;letter-spacing:.1em;padding:3px 6px;border-radius:6px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:9}.sheet.on{display:flex}
.box{width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:20px 16px 30px;background:#0d0d14;border-top:1px solid rgba(255,255,255,.1);max-height:90vh;overflow:auto;position:relative}
.box .hd{display:flex;gap:14px;align-items:center}.box .hd svg{width:100px;height:117px;flex:0 0 100px}.box .hd b{font-size:22px;display:block}.box .hd i{font-style:normal;opacity:.65;font-size:13px}
.rob{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;background:rgba(255,255,255,.04);margin-top:10px;border:1px solid rgba(255,255,255,.06)}
.rob svg{width:62px;height:62px;flex:0 0 62px}.rob b{font-size:16px}.rob small{display:block;font-size:11px;letter-spacing:.12em;font-weight:800;opacity:.7;margin:2px 0 5px}.rob p{font-size:13.5px;line-height:1.35;opacity:.92}
.rob .riv{font-size:10px;font-weight:900;background:#dc2626;padding:2px 6px;border-radius:5px;margin-left:6px;letter-spacing:.08em}
.x{position:absolute;right:14px;top:12px;background:none;border:0;color:#fff;font-size:28px;opacity:.6}
</style></head><body>
<header><h1>EQUIPES E ROBÔS</h1><p>27 equipes · 81 robôs, nenhum repetido. Toque numa equipe para conhecer os robôs.</p></header>
<div id="lista"></div>
<div class="sheet" id="sh"><div class="box" id="bx"></div></div>
<script src="copa-dados.js"></script><script src="brasoes.js"></script><script>const robo2=window.robo;</script>
<script>
let G=0;const RID=new Map();EQUIPES.forEach(e=>e.robos.forEach(r=>RID.set(r,G++)));const emblema=e=>brasao(e),robo=(r,e)=>robo2(r,e,RID.get(r));
const L=document.getElementById('lista');
DIVISOES.forEach(d=>{const es=EQUIPES.filter(e=>e.div===d.id);if(!es.length)return;
 L.insertAdjacentHTML('beforeend',`<section class="div"><h2 style="color:${d.cor}">${d.nome.toUpperCase()}</h2><div class="grid">${es.map(e=>`<div class="eq${e.voce?' voce':''}" data-id="${e.id}" style="--c1:${e.c1}">${e.voce?'<span class="tg" style="background:linear-gradient(90deg,#3B82F6,#22D3EE);color:#050b1f">VOCÊ</span>':''}${e.gigante?'<span class="tg" style="background:#e8c46a;color:#2a1a04">GIGANTE</span>':''}${emblema(e)}<b>${e.nome}</b><small>${e.lema}</small><div class="rb">${e.robos.map((r,i)=>robo(r,e,i)).join('')}</div></div>`).join('')}</div></section>`)});
const sh=document.getElementById('sh'),bx=document.getElementById('bx');sh.onclick=ev=>{if(ev.target===sh)sh.classList.remove('on')};
document.querySelectorAll('.eq').forEach(el=>el.onclick=()=>{const e=EQUIPES.find(x=>x.id===el.dataset.id),d=DIVISOES.find(x=>x.id===e.div);
 bx.style.background=`radial-gradient(circle at 20% 0,${e.c1}55,transparent 60%),#0d0d14`;
 bx.innerHTML=`<button class="x" onclick="sh.classList.remove('on')">×</button><div class="hd">${emblema(e)}<div><b>${e.nome}</b><i>${d.nome} · "${e.lema}"</i></div></div>`+
 e.robos.map((r,i)=>`<div class="rob">${robo(r,e,i)}<div><b>${r.n}</b>${r.rival?'<span class="riv">RIVAL</span>':''}<small>${r.f.toUpperCase()}${r.voce?' · VOCÊ':''}</small><p>${r.voce?'Você é o capitão do Studio Evolution Tech. Seu estudo puxa o time inteiro.':'“'+r.fr+'”'}</p></div></div>`).join('');sh.classList.add('on')});
</script></body></html>
