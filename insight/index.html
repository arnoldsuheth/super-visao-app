<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

html,body{height:100%;overflow-x:hidden}
body{font-family:"Avenir Next",Nunito,-apple-system,"SF Pro Text",Inter,Arial,sans-serif;background:var(--bg);color:var(--tx);transition:background .3s,color .3s}
body.claro{--bg:#fafafa;--tx:#111;--mu:#737373;--chip:#efefef;--ln:#e6e6e6;--card:#fff;--inv:#fff}
body.faisca{--bg:#0b0b0d;--tx:#f5f5f5;--mu:#9a9a9a;--chip:#1a1a1d;--ln:#222226;--card:#141416;--inv:#111}
#app{max-width:480px;margin:0 auto;min-height:100%;position:relative;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
.glow{position:fixed;inset:0;pointer-events:none;z-index:0}

.ic{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
.btn{background:none;border:0;color:inherit;cursor:pointer;display:grid;place-items:center;transition:transform .12s}.btn:active{transform:scale(.86)}
.gtx{background:var(--gt);-webkit-background-clip:text;background-clip:text;color:transparent}

.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:calc(10px + env(safe-area-inset-top)) 14px 8px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}

.stories{display:flex;gap:12px;padding:6px 14px 12px;overflow-x:auto;scrollbar-width:none;position:relative;z-index:1}.stories::-webkit-scrollbar{display:none}

.ring b,.av b,.big b{overflow:hidden}.avi span{font-size:1.9em;line-height:1}.av .avi span{font-size:1.25em}.big .avi span{font-size:2.1em}
.ring b{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--chip);border:3px solid var(--bg);font-size:13px;font-weight:900}
.sto span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}

.post{position:relative;z-index:1;border-top:1px solid var(--ln);padding-bottom:6px;background:var(--bg)}
.ph{display:flex;align-items:center;gap:9px;padding:10px 14px}
.av{width:34px;height:34px;border-radius:50%;padding:2px;background:var(--gc);flex:0 0 auto;cursor:pointer}.av b{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--chip);border:2px solid var(--bg);font-size:10px;font-weight:900}

.like.on svg{fill:url(#hg);stroke:url(#hg)}.save.on svg{fill:currentColor}
.cap{padding:2px 14px 6px;font-size:13.5px;line-height:1.45}.cap b{font-weight:800}
.bigh{position:absolute;left:50%;top:50%;width:110px;height:110px;margin:-55px;opacity:0;pointer-events:none;z-index:5}
.bigh.go{animation:hb .85s ease-out}@keyframes hb{0%{opacity:0;transform:scale(.3)}30%{opacity:1;transform:scale(1.15)}100%{opacity:0;transform:translateY(-24px)}}

.sl .em{font-size:46px;line-height:1}.sl h3{font-size:27px;line-height:1.12;font-weight:900}.sl h3 i{font-style:normal;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:4px}

.code{font:13.5px/1.6 Menlo,ui-monospace,monospace;background:rgba(0,0,0,.28);padding:12px 14px;border-radius:12px;white-space:pre-wrap;word-break:break-word}
.dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:5px;z-index:3}.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.45);transition:.3s}.dots i.on{background:#fff;width:16px;border-radius:3px}
.cnt{position:absolute;top:12px;right:12px;font:11px Menlo,monospace;color:#fff;background:rgba(0,0,0,.35);padding:3px 8px;border-radius:10px;z-index:3}

.dz{height:100%;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:22px;background:var(--card)}

.ops{display:grid;gap:9px}.ops button{padding:14px;border-radius:14px;border:1.5px solid var(--ln);background:var(--chip);color:var(--tx);font:700 14.5px inherit;font-family:inherit;text-align:left;cursor:pointer}
.ops button.ok{border-color:#2fbf71;background:rgba(47,191,113,.15)}.ops button.no{border-color:#ff5a46;background:rgba(255,90,70,.12);animation:tre .3s}
@keyframes tre{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fb{font-size:13.5px;line-height:1.45;min-height:20px}.fb b.ok{color:#1fa95e}.fb b.no{color:#ff5a46}
.dica{font-size:12px;color:var(--mu);text-decoration:underline;cursor:pointer;align-self:flex-start;background:none;border:0;font-family:inherit}
/* ao vivo */
.av2{height:100%;display:grid;grid-template-rows:1fr 1fr;background:var(--card)}
.av2 pre{margin:0;padding:12px 14px;font:12.5px/1.55 Menlo,ui-monospace,monospace;overflow:auto;background:#141416;color:#e8e8e8}

.av2 iframe{width:100%;height:100%;border:0;background:#fff}
.av2 .lb{position:absolute;left:10px;font:800 9px Menlo,monospace;letter-spacing:2px;padding:3px 7px;border-radius:6px;background:var(--g);color:#fff;z-index:2}
/* curiosidade */
.fl{position:absolute;inset:0;perspective:1000px;cursor:pointer}.fl .in{position:absolute;inset:0;transition:transform .7s cubic-bezier(.4,1.4,.5,1);transform-style:preserve-3d}.fl.v .in{transform:rotateY(180deg)}
.fa{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px;padding:30px;background:var(--g);color:#fff}

.fa small{font:800 11px Menlo,monospace;letter-spacing:3px;opacity:.9}.fa h3{font-size:24px;line-height:1.2;font-weight:900}.fa p{font-size:15px;line-height:1.55}.fa .em{font-size:52px}
.fa .tp{font:11px Menlo,monospace;letter-spacing:2px;animation:pul 1.6s infinite}@keyframes pul{50%{opacity:.4}}

.nav>div{max-width:480px;margin:0 auto;display:flex;justify-content:space-around;align-items:center}

.me{width:27px;height:27px;border-radius:50%;padding:1.5px;background:var(--gc)}.me i{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:#5b4a3b;border:2px solid var(--bg);font-style:normal;font-size:11px;font-weight:900;color:#fff}
.badge{position:absolute;top:4px;right:6px;min-width:16px;height:16px;border-radius:8px;background:#ff3040;color:#fff;font:800 10px inherit;display:grid;place-items:center;padding:0 4px}
/* telas */
.tela{display:none;position:relative;z-index:1}.tela.on{display:block}
.hd{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 14px 6px;font-weight:900;font-size:19px}.hd .sp{margin-left:auto;display:flex;gap:14px}
.pf{display:flex;align-items:center;gap:18px;padding:10px 16px}
.big{width:86px;height:86px;border-radius:50%;padding:3px;background:var(--gc);flex:0 0 auto}.big b{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--chip);border:3px solid var(--bg);font-size:22px;font-weight:900}
.nums{display:flex;flex:1;justify-content:space-around;text-align:center}.nums b{display:block;font-size:19px;font-weight:900}.nums small{font-size:12px;color:var(--mu)}
.cam{position:absolute;right:-2px;bottom:-2px;width:28px;height:28px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:14px;box-shadow:0 0 0 2px var(--ln)}
.bio{padding:2px 16px;font-size:13.5px;line-height:1.45}.bio b{display:block;font-size:14px}.bio span{color:var(--mu)}
.pbar{margin:12px 16px 0;height:7px;border-radius:4px;background:var(--ln);overflow:hidden}.pbar i{display:block;height:100%;background:var(--g);border-radius:4px;transition:width .6s}
.pbl{display:flex;justify-content:space-between;padding:5px 16px 0;font-size:11.5px;color:var(--mu)}
.btns{display:flex;gap:7px;padding:12px 16px}.btns button{flex:1;padding:9px;border-radius:10px;border:0;font:800 13px inherit;font-family:inherit;background:var(--chip);color:var(--tx);cursor:pointer}.btns .gr{background:var(--g);color:#fff}
.hl{display:flex;gap:14px;padding:6px 16px 12px;overflow-x:auto;scrollbar-width:none}.hl div{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;flex:0 0 auto}
.hl i{width:60px;height:60px;border-radius:50%;border:1px solid var(--ln);display:grid;place-items:center;font-style:normal;font-size:20px;background:var(--card)}
.hl i.done{border:2.5px solid transparent;background:linear-gradient(var(--card),var(--card)) padding-box,var(--g) border-box}
.tabs{display:flex;border-top:1px solid var(--ln)}.tabs button{flex:1;padding:11px 0;font:12.5px inherit;font-family:inherit;color:var(--mu);background:none;border:0;cursor:pointer}.tabs button.on{color:var(--tx);font-weight:800;box-shadow:inset 0 1.5px 0 var(--tx)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.grid>div{aspect-ratio:1;display:grid;place-items:center;text-align:center;font-size:12px;font-weight:800;color:#fff;padding:8px;line-height:1.2;position:relative;cursor:pointer;background:var(--g)}
.grid>div:nth-child(3n+2){background:linear-gradient(45deg,#d62976,#962fbf 60%,#4f5bd5)}.grid>div:nth-child(3n){background:linear-gradient(45deg,#fa7e1e,#d62976 70%)}
.grid>div.lk{background:var(--chip)!important;color:var(--mu);cursor:default}
.grid>div .tp{position:absolute;top:5px;right:6px;font-size:13px}
.vazio{padding:40px 24px;text-align:center;color:var(--mu);font-size:14px;line-height:1.5}
.lista{padding:4px 14px}.it{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--ln)}.it .av{width:44px;height:44px}.it b{font-size:14px}.it small{display:block;font-size:12px;color:var(--mu)}.it .go{margin-left:auto;font-weight:800;font-size:12px}
.busca{margin:6px 14px 10px;padding:11px 14px;border-radius:12px;background:var(--chip);font-size:14px;color:var(--mu)}

.ofc{padding:6px 14px 20px}
.miss{border-radius:16px;padding:14px;margin-bottom:12px;background:var(--card);border:1px solid var(--ln)}
.miss small{font:800 10.5px Menlo,monospace;letter-spacing:2px}.miss h4{font-size:17px;margin:4px 0}.miss p{font-size:13.5px;line-height:1.45}
.miss .ok{color:#1fa95e;font-weight:800}
textarea.ed{width:100%;min-height:200px;border-radius:14px;border:1.5px solid var(--ln);background:#141416;color:#eee;font:14px/1.55 Menlo,ui-monospace,monospace;padding:12px;resize:vertical;outline:none}

.kb{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.kb button{font:700 13px Menlo,monospace;padding:7px 10px;border-radius:8px;border:1px solid var(--ln);background:var(--chip);color:var(--tx);cursor:pointer}
.prev{margin-top:10px;border-radius:14px;overflow:hidden;border:1px solid var(--ln);background:#fff}.prev .lbx{font:800 10px Menlo,monospace;letter-spacing:2px;padding:6px 10px;background:var(--g);color:#fff}
.prev iframe{width:100%;height:260px;border:0;display:block}
/* story viewer */
#sv{position:fixed;inset:0;z-index:60;background:#000;color:#fff;display:none}#sv.on{display:block}

.modal{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center}.modal.on{display:flex}

<script>

(function(){const cv=$('#fx'),c=cv.getContext('2d');const C=['#feda75','#fa7e1e','#d62976','#962fbf','#4f5bd5'];let W,H,P=[];
 const tam=()=>{const d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;c.setTransform(d,0,0,d,0,0);P=Array.from({length:Math.round(W*H/9000)},()=>({x:Math.random()*W,y:Math.random()*H,v:8+Math.random()*16,r:.8+Math.random()*1.7,c:C[Math.floor(Math.random()*5)],p:Math.random()*6}))};tam();addEventListener('resize',tam);
 let last=performance.now();(function f(t){const dt=Math.min(.05,(t-last)/1000);last=t;if(S.tema==='faisca'&&!document.hidden){c.clearRect(0,0,W,H);P.forEach(s=>{s.y-=s.v*dt;if(s.y<-5){s.y=H+5;s.x=Math.random()*W}c.globalAlpha=.22+.3*Math.abs(Math.sin(t/600+s.p));c.fillStyle=s.c;c.beginPath();c.arc(s.x,s.y,s.r,0,7);c.fill()});c.globalAlpha=1}requestAnimationFrame(f)})(last)})();
