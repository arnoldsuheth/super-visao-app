<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#fafafa">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Insight"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icone-180.png"><link rel="icon" href="./icone-192.png">
<title>insight</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--g:linear-gradient(45deg,#feda75,#fa7e1e 25%,#d62976 55%,#962fbf 78%,#4f5bd5);--gc:conic-gradient(from 200deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5,#feda75);--gt:linear-gradient(90deg,#fa7e1e,#d62976,#962fbf)}
html,body{height:100%;overflow-x:hidden}
body{font-family:-apple-system,"SF Pro Text","Helvetica Neue",Inter,Arial,sans-serif;background:var(--bg);color:var(--tx);transition:background .3s,color .3s}
body.claro{--bg:#fafafa;--tx:#111;--mu:#737373;--chip:#efefef;--ln:#e6e6e6;--card:#fff;--inv:#fff}
body.faisca{--bg:#0b0b0d;--tx:#f5f5f5;--mu:#9a9a9a;--chip:#1a1a1d;--ln:#222226;--card:#141416;--inv:#111}
#app{max-width:480px;margin:0 auto;min-height:100%;position:relative;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.glow{position:fixed;inset:0;pointer-events:none;z-index:0}
body.claro .glow{background:radial-gradient(circle at 100% 0,rgba(214,41,118,.10),transparent 40%),radial-gradient(circle at 0 100%,rgba(250,126,30,.10),transparent 40%)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;display:none}body.faisca #fx{display:block}
.ic{width:27px;height:27px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
.btn{background:none;border:0;color:inherit;cursor:pointer;display:grid;place-items:center;transition:transform .12s}.btn:active{transform:scale(.86)}
.gtx{background:var(--gt);-webkit-background-clip:text;background-clip:text;color:transparent}
/* topo */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;padding:calc(8px + env(safe-area-inset-top)) 18px 10px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.wm{font-weight:900;font-size:30px;letter-spacing:-.8px;margin:0 auto;display:flex;align-items:center;gap:8px;transform:translateX(18px)}
.wm svg{width:30px;height:30px;border-radius:8px}
/* stories */
.stories{display:flex;gap:16px;padding:8px 14px 14px;overflow-x:auto;scrollbar-width:none;position:relative;z-index:1}.stories::-webkit-scrollbar{display:none}
.sto{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:13px;flex:0 0 auto;width:94px;text-align:center;cursor:pointer}
.ring{width:94px;height:94px;border-radius:50%;padding:3px;position:relative;background:var(--gc)}.ring.vis{background:var(--ln)}
.ring b,.av b,.big b{overflow:hidden}.avi span{font-size:2.6em;line-height:1}.av .avi span{font-size:1.25em}.big .avi span{font-size:2.1em}
.ring b{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--chip);border:4px solid var(--bg);font-size:16px;font-weight:900}
.ring .add{position:absolute;right:2px;bottom:2px;width:30px;height:30px;border-radius:50%;background:#111;color:#fff;border:3px solid var(--bg);display:grid;place-items:center;font-size:20px;font-weight:700;line-height:1}
.sto span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
/* post */
.post{position:relative;z-index:1;border-top:1px solid var(--ln);padding-bottom:6px;background:var(--bg)}
.ph{display:flex;align-items:center;gap:11px;padding:12px 14px}
.av{width:42px;height:42px;border-radius:50%;padding:2px;background:var(--gc);flex:0 0 auto;cursor:pointer}.av b{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--chip);border:2px solid var(--bg);font-size:10px;font-weight:900}
.ph strong{font-size:16px;font-weight:700;cursor:pointer}.ph small{display:block;font-size:12.5px;color:var(--mu)}.ph .mn{margin-left:auto;width:30px;display:grid;gap:5px}.ph .mn i{display:block;height:2.2px;border-radius:2px;background:var(--tx)}.ph .mn i+i{width:70%}
.seg+.mn{margin-left:10px}
.seg{margin-left:auto;font:800 12px inherit;font-family:inherit;padding:7px 14px;border-radius:9px;border:0;background:var(--g);color:#fff;cursor:pointer}.seg.on{background:var(--chip);color:var(--tx)}
.md{position:relative;width:100%;aspect-ratio:4/5;overflow:hidden;user-select:none;-webkit-user-select:none}
.acts{display:flex;align-items:center;gap:20px;padding:12px 16px 6px}.acts .sv{margin-left:auto}
.like.on svg{fill:url(#hg);stroke:url(#hg)}.save.on svg{fill:currentColor}
.apoio{margin-top:10px;padding:10px;border-radius:14px;background:var(--chip);border:1px solid var(--ln)}.apoio small{display:block;font-weight:800;font-size:10.5px;letter-spacing:.1em;color:var(--mu);margin-bottom:6px}
.apoio [data-post]{display:block;width:100%;text-align:left;border:0;background:var(--bg);color:var(--tx);border-radius:10px;padding:9px 11px;margin-bottom:6px;font:700 13.5px inherit;font-family:inherit;cursor:pointer}.apoio [data-post] i{font-style:normal;font-weight:600;color:var(--mu);font-size:12px}
.apb{display:flex;gap:6px}.apb button{flex:1;border:1.5px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:10px;padding:9px;font:800 13px inherit;font-family:inherit}.dica{margin-top:8px;font-size:14px;line-height:1.45;color:var(--tx);text-decoration:none}
.cap{padding:2px 16px 10px;font-size:15px;line-height:1.45}.cap b{font-weight:800}
.xtra{display:flex;gap:8px;padding:0 16px 12px;flex-wrap:wrap}.xtra button{border:1.5px solid var(--ln);background:var(--chip);color:var(--tx);border-radius:99px;padding:7px 12px;font:700 13px inherit;font-family:inherit;cursor:pointer}.xtra button.on{border-color:transparent;background:var(--g);color:#fff}
.altbox{margin:0 16px 14px;padding:14px;border-radius:16px;background:var(--chip);border:1.5px solid var(--ln);font-size:15px;line-height:1.5;animation:altin .35s ease}.altbox small{display:block;font-weight:800;font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px;background:var(--gt);-webkit-background-clip:text;color:transparent}
@keyframes altin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.estudo{margin:4px 14px 12px;padding:12px 14px;border-radius:16px;display:flex;align-items:center;gap:12px;background:var(--chip);border:1.5px solid var(--ln);font-size:14px;line-height:1.35}.estudo.ao{background:var(--g);color:#fff;border-color:transparent}.estudo .e{font-size:26px}.estudo b{display:block;font-size:15px}
#sv .who .voz{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:99px;padding:5px 10px;font:700 12px inherit;font-family:inherit;margin-left:auto}#sv .who .voz+.x{margin-left:6px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}.mgrid div{position:relative;aspect-ratio:3/4;overflow:hidden;background:#fff;cursor:pointer}.mgrid iframe{position:absolute;left:0;top:0;width:300%;height:300%;transform:scale(.3334);transform-origin:0 0;border:0;pointer-events:none}.mgrid small{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.6);color:#fff;font-size:10px;padding:2px 6px;border-radius:6px}
.retro{margin:0 16px 10px;width:calc(100% - 32px);padding:12px;border:0;border-radius:14px;background:var(--g);color:#fff;font:800 15px inherit;font-family:inherit;cursor:pointer}
.bigh{position:absolute;left:50%;top:50%;width:110px;height:110px;margin:-55px;opacity:0;pointer-events:none;z-index:5}
.bigh.go{animation:hb .85s ease-out}@keyframes hb{0%{opacity:0;transform:scale(.3)}30%{opacity:1;transform:scale(1.15)}100%{opacity:0;transform:translateY(-24px)}}
/* carrossel */
.car{display:flex;height:100%;transition:transform .4s cubic-bezier(.3,1,.4,1)}
.sl{flex:0 0 100%;height:100%;padding:28px 26px;display:flex;flex-direction:column;justify-content:center;gap:14px;background:var(--g);color:#fff}
.sl:nth-child(2n){background:linear-gradient(45deg,#d62976,#962fbf 60%,#4f5bd5)}.sl:nth-child(3n){background:linear-gradient(45deg,#fa7e1e,#d62976 70%)}
.sl .em{font-size:56px;line-height:1}.sl h3{font-size:31px;line-height:1.12;font-weight:900}.sl h3 i{font-style:normal;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:4px}
.sl p{font-size:17px;line-height:1.5;opacity:.96}
.code{font:13.5px/1.6 Menlo,ui-monospace,monospace;background:rgba(0,0,0,.28);padding:12px 14px;border-radius:12px;white-space:pre-wrap;word-break:break-word}
.dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:5px;z-index:3}.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.45);transition:.3s}.dots i.on{background:#fff;width:16px;border-radius:3px}
.cnt{position:absolute;top:12px;right:12px;font:11px Menlo,monospace;color:#fff;background:rgba(0,0,0,.35);padding:3px 8px;border-radius:10px;z-index:3}
.tapz{position:absolute;top:0;bottom:0;width:40%;z-index:2}.tapz.r{right:0}.tapz.l{left:0}
/* desafio */
.dz{height:100%;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:22px;background:var(--card)}
.dz .tag{font:800 11px Menlo,monospace;letter-spacing:2px}.dz h3{font-size:23px;line-height:1.3}
.dz .code{background:var(--chip);color:var(--tx)}
.ops{display:grid;gap:9px}.ops button{padding:14px;border-radius:14px;border:1.5px solid var(--ln);background:var(--chip);color:var(--tx);font:700 14.5px inherit;font-family:inherit;text-align:left;cursor:pointer}
.ops button.ok{border-color:#2fbf71;background:rgba(47,191,113,.15)}.ops button.no{border-color:#ff5a46;background:rgba(255,90,70,.12);animation:tre .3s}
@keyframes tre{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fb{font-size:13.5px;line-height:1.45;min-height:20px}.fb b.ok{color:#1fa95e}.fb b.no{color:#ff5a46}
.dica{font-size:12px;color:var(--mu);text-decoration:underline;cursor:pointer;align-self:flex-start;background:none;border:0;font-family:inherit}
/* ao vivo */
.av2{height:100%;display:grid;grid-template-rows:1fr 1fr;background:var(--card)}
.av2 pre{margin:0;padding:12px 14px;font:12.5px/1.55 Menlo,ui-monospace,monospace;overflow:auto;background:#141416;color:#e8e8e8}
.av2 pre{background:#1e1e1e;color:#d4d4d4;white-space:pre-wrap}
.av2 iframe{width:100%;height:100%;border:0;background:#fff}
.av2 .lb{position:absolute;left:10px;font:800 9px Menlo,monospace;letter-spacing:2px;padding:3px 7px;border-radius:6px;background:var(--g);color:#fff;z-index:2}
/* curiosidade */
.fl{position:absolute;inset:0;perspective:1000px;cursor:pointer}.fl .in{position:absolute;inset:0;transition:transform .7s cubic-bezier(.4,1.4,.5,1);transform-style:preserve-3d}.fl.v .in{transform:rotateY(180deg)}
.fa{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px;padding:30px;background:var(--g);color:#fff}
.fa.b{transform:rotateY(180deg);background:linear-gradient(45deg,#962fbf,#4f5bd5)}
.fa small{font:800 11px Menlo,monospace;letter-spacing:3px;opacity:.9}.fa h3{font-size:27px;line-height:1.2;font-weight:900}.fa p{font-size:17px;line-height:1.55}.fa .em{font-size:52px}
.fa .tp{font:11px Menlo,monospace;letter-spacing:2px;animation:pul 1.6s infinite}@keyframes pul{50%{opacity:.4}}
/* barra de baixo */
.nav{position:fixed;left:16px;right:16px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;padding:7px;border-radius:40px;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 8px 30px rgba(0,0,0,.14),0 0 0 1px var(--ln);max-width:460px;margin:0 auto}
.nav>div{max-width:480px;margin:0 auto;display:flex;justify-content:space-around;align-items:center}
.nav .btn{width:64px;height:52px;border-radius:30px;opacity:.75}.nav .btn.on{opacity:1;background:var(--chip);width:96px}.nav .btn.on .ic{stroke-width:2.4}
.nav .mid{width:56px;height:44px;border-radius:16px;background:var(--g);color:#fff;opacity:1}
.me{width:34px;height:34px;border-radius:50%;padding:1.5px;background:var(--gc)}.me i{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:#5b4a3b;border:2px solid var(--bg);font-style:normal;font-size:11px;font-weight:900;color:#fff}
.badge{position:absolute;top:4px;right:6px;min-width:16px;height:16px;border-radius:8px;background:#ff3040;color:#fff;font:800 10px inherit;display:grid;place-items:center;padding:0 4px}
/* telas */
.tela{display:none;position:relative;z-index:1}.tela.on{display:block}
.hd{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 14px 6px;font-weight:900;font-size:19px}.hd .sp{margin-left:auto;display:flex;gap:14px}
.pf{display:flex;align-items:center;gap:18px;padding:10px 16px}
.big{width:86px;height:86px;border-radius:50%;padding:3px;background:var(--gc);flex:0 0 auto}.big b{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--chip);border:3px solid var(--bg);font-size:22px;font-weight:900}
.nums{display:flex;flex:1;justify-content:space-around;text-align:center}.nums b{display:block;font-size:19px;font-weight:900}.nums small{font-size:12px;color:var(--mu)}
.cam{position:absolute;right:-2px;bottom:-2px;width:28px;height:28px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:14px;box-shadow:0 0 0 2px var(--ln)}
.bio{padding:2px 16px;font-size:13.5px;line-height:1.45}.bio b{display:block;font-size:14px}.bio span{color:var(--mu)}
.pbar{margin:12px 16px 0;height:7px;border-radius:4px;background:var(--ln);overflow:hidden}.pbar i{display:block;height:100%;background:var(--g);border-radius:4px;transition:width .6s}
.pbl{display:flex;justify-content:space-between;padding:5px 16px 0;font-size:11.5px;color:var(--mu)}
.btns{display:flex;gap:7px;padding:12px 16px}.btns button{flex:1;padding:9px;border-radius:10px;border:0;font:800 13px inherit;font-family:inherit;background:var(--chip);color:var(--tx);cursor:pointer}.btns .gr{background:var(--g);color:#fff}
.hl{display:flex;gap:14px;padding:6px 16px 12px;overflow-x:auto;scrollbar-width:none}.hl div{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;flex:0 0 auto}
.hl i{width:60px;height:60px;border-radius:50%;border:1px solid var(--ln);display:grid;place-items:center;font-style:normal;font-size:20px;background:var(--card)}
.hl i.done{border:2.5px solid transparent;background:linear-gradient(var(--card),var(--card)) padding-box,var(--g) border-box}
.tabs{display:flex;border-top:1px solid var(--ln)}.tabs button{flex:1;padding:11px 0;font:12.5px inherit;font-family:inherit;color:var(--mu);background:none;border:0;cursor:pointer}.tabs button.on{color:var(--tx);font-weight:800;box-shadow:inset 0 1.5px 0 var(--tx)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.grid>div{aspect-ratio:1;display:grid;place-items:center;text-align:center;font-size:12px;font-weight:800;color:#fff;padding:8px;line-height:1.2;position:relative;cursor:pointer;background:var(--g)}
.grid>div:nth-child(3n+2){background:linear-gradient(45deg,#d62976,#962fbf 60%,#4f5bd5)}.grid>div:nth-child(3n){background:linear-gradient(45deg,#fa7e1e,#d62976 70%)}
.grid>div.lk{background:var(--chip)!important;color:var(--mu);cursor:default}
.grid>div .tp{position:absolute;top:5px;right:6px;font-size:13px}
.vazio{padding:40px 24px;text-align:center;color:var(--mu);font-size:14px;line-height:1.5}
.lista{padding:4px 14px}.it{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--ln)}.it .av{width:44px;height:44px}.it b{font-size:14px}.it small{display:block;font-size:12px;color:var(--mu)}.it .go{margin-left:auto;font-weight:800;font-size:12px}
.busca{margin:6px 14px 10px;padding:11px 14px;border-radius:12px;background:var(--chip);font-size:14px;color:var(--mu)}
/* oficina */
.ofc{padding:6px 14px 20px}
.miss{border-radius:16px;padding:14px;margin-bottom:12px;background:var(--card);border:1px solid var(--ln)}
.miss small{font:800 10.5px Menlo,monospace;letter-spacing:2px}.miss h4{font-size:17px;margin:4px 0}.miss p{font-size:13.5px;line-height:1.45}
.miss .ok{color:#1fa95e;font-weight:800}
textarea.old-ed{width:100%;min-height:200px;border-radius:14px;border:1.5px solid var(--ln);background:#141416;color:#eee;font:16px/1.55 Menlo,ui-monospace,monospace;padding:12px;resize:vertical;outline:none}
textarea.ed:focus{border-color:#d62976}
.kb{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.kb button{font:700 13px Menlo,monospace;padding:7px 10px;border-radius:8px;border:1px solid var(--ln);background:var(--chip);color:var(--tx);cursor:pointer}
.prev{margin-top:10px;border-radius:14px;overflow:hidden;border:1px solid var(--ln);background:#fff}.prev .lbx{font:800 10px Menlo,monospace;letter-spacing:2px;padding:6px 10px;background:var(--g);color:#fff}
.prev iframe{width:100%;height:260px;border:0;display:block}

/* ===== Oficina em tela cheia (modo quadro) ===== */
.ofx{display:flex;flex-direction:column;gap:8px}
.oftb{display:flex;flex-direction:column;gap:6px;animation:ofdesce .35s cubic-bezier(.2,.8,.2,1)}
@keyframes ofdesce{from{transform:translateY(-110%);opacity:0}}
.oft1{display:flex;gap:6px;align-items:stretch}
.ofsair{flex:0 0 40px;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:12px;font:300 30px/1 inherit;font-family:inherit;cursor:pointer}
.ofmb{flex:1;min-width:0;text-align:left;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:12px;padding:6px 10px;font-family:inherit;cursor:pointer}
.ofmb.on{border-color:var(--tx)}
.ofmb small{display:block;font:800 9.5px Menlo,monospace;letter-spacing:1.3px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ofmb b{display:block;font-size:14px;margin-top:1px}
.ofmb p{font-size:12.5px;line-height:1.35;color:var(--mu);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.oft2{display:flex;gap:4px;padding:4px;border-radius:16px;background:color-mix(in srgb,var(--card) 94%,transparent);border:1px solid var(--ln);box-shadow:0 6px 20px rgba(0,0,0,.08)}
.oft2 button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;border:0;background:none;color:var(--tx);border-radius:11px;padding:5px 0 4px;font:700 9.5px inherit;font-family:inherit;cursor:pointer}
.oft2 button i{font-style:normal;font-size:18px;line-height:1.1}
.oft2 button.on{background:var(--g);color:#fff}
.ofmain{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.ofmain .vsc{flex:1;min-height:0;display:flex;flex-direction:column}
.vsc .vtop span{margin-left:auto;color:#6a9955}
.cmbox{flex:1;min-height:0}.cmbox .cm-editor{height:100%;background:#1e1e1e}
.ofsite{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;border-radius:12px;overflow:hidden;border:1px solid var(--ln);background:#fff;animation:ofsobe .25s ease}
.ofsite[hidden]{display:none}.ofsite .lbx{font:800 10px Menlo,monospace;letter-spacing:2px;padding:7px 10px;background:var(--g);color:#fff}.ofsite iframe{flex:1;width:100%;border:0}
@keyframes ofsobe{from{opacity:0;transform:translateY(12px)}}
.ofpan{position:absolute;left:0;right:0;top:0;z-index:5;max-height:78%;overflow:auto;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--ln);box-shadow:0 18px 40px rgba(0,0,0,.25);animation:ofdesce2 .22s ease}
.ofpan[hidden]{display:none}
@keyframes ofdesce2{from{opacity:0;transform:translateY(-10px)}}
.ofpx{position:sticky;top:0;float:right;width:30px;height:30px;border-radius:50%;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font-size:13px;cursor:pointer;z-index:2}
.ofh{display:block;font:800 10px Menlo,monospace;letter-spacing:1.5px;color:var(--mu);margin:6px 0 8px}
