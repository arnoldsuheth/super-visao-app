*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100dvh;font-family:var(--sans);color:var(--txt);background:linear-gradient(180deg,var(--bg-top) 0,var(--bg) 340px,var(--bg) 100%);-webkit-font-smoothing:antialiased;padding-left:max(0px,env(safe-area-inset-left));padding-right:max(0px,env(safe-area-inset-right))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{max-width:560px;margin:0 auto;min-height:100dvh;position:relative;padding:0 18px calc(110px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:calc(10px + env(safe-area-inset-top)) 0 8px;margin:0 -18px;background:linear-gradient(180deg,var(--bg-top) 60%,transparent)}
.top b{font:600 12px var(--sans);letter-spacing:.42em;color:var(--sub);text-transform:uppercase}
.sino{position:absolute;right:16px;bottom:4px;width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--txt);display:grid;place-items:center}
.sino i{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--menst);display:none}.sino.tem i{display:block}
h1.ola{font:500 clamp(34px,10vw,44px)/1.04 var(--serif);letter-spacing:-.01em;margin:14px 0 6px;text-wrap:balance}
.sub{color:var(--sub);font-size:15px;margin:0}
.vidro{background:var(--glass);border:1px solid var(--borda);border-radius:20px;box-shadow:var(--sombra);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.jornada{width:100%;margin-top:18px;display:flex;align-items:center;gap:12px;padding:16px 18px;text-align:left;color:inherit}
.jornada div{flex:1;min-width:0}.jornada b{display:block;font:600 18px var(--serif)}.jornada small{color:var(--sub);font-size:13px}
.trilho{height:7px;border-radius:9px;background:var(--trilho);overflow:hidden;margin-top:8px}.trilho i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .5s}
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.chip{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:12px;font-weight:700;font-size:13px;line-height:1.2;color:inherit;text-align:left;min-width:0}.chip svg{color:var(--acc)}
.chip .seta{display:none}
.foto{position:relative;margin:4px -18px 0;height:min(118vw,560px);overflow:hidden}
.foto img{width:100%;height:100%;object-fit:cover;object-position:50% 22%;display:block}
.foto::before{content:"";position:absolute;inset:0 0 auto;height:16%;z-index:1;background:linear-gradient(180deg,var(--bg) 0,transparent)}
.foto::after{content:"";position:absolute;inset:auto 0 0;height:34%;background:linear-gradient(0deg,var(--bg) 4%,transparent)}
html[data-tema=sol] .foto img{filter:saturate(1.1) hue-rotate(-12deg) brightness(.92)}
html[data-tema=lavanda] .foto{margin:16px 0 0;height:min(104vw,500px);border-radius:999px 999px 26px 26px / 46% 46% 26px 26px;border:5px solid #fff;box-shadow:var(--sombra)}
html[data-tema=lavanda] .foto::before{display:none}html[data-tema=lavanda] .foto::after{height:40%;background:linear-gradient(0deg,rgba(247,241,252,.95),transparent)}
.foto-rodape{position:absolute;left:14px;right:14px;bottom:14px;z-index:2;display:grid;gap:10px}
.agua{justify-self:start;display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:30px;font-weight:700;font-size:13px;color:inherit}
.agua .gotas{display:flex;gap:3px}.agua .gotas i{width:7px;height:10px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:var(--trilho)}.agua .gotas i.on{background:var(--acc)}
.verso{padding:15px 16px;text-align:left;color:inherit;width:100%;border:1px solid var(--borda)}
.verso blockquote{margin:0;font:500 16px/1.4 var(--serif)}
.verso small{display:block;margin-top:6px;font-weight:800;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--acc)}
html[data-tema=sol] .verso small{color:var(--acc2)}
.blocos{display:grid;gap:12px;margin-top:14px}
.bloco{display:flex;gap:12px;align-items:center;padding:14px 16px;text-align:left;color:inherit;width:100%}
.bloco .ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--trilho);color:var(--acc);flex:none}
.bloco div{flex:1;min-width:0}.bloco b{display:block;font-size:15px}.bloco small{color:var(--sub);font-size:13px;line-height:1.35;display:block}
.aviso-copia{border-left:4px solid var(--acc)}
/* páginas */
.pagina{display:none;animation:entra .25s ease}.pagina.on{display:block}
@keyframes entra{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2.tit{font:500 32px/1.1 var(--serif);margin:16px 0 4px}
.sec{margin-top:20px}
.sec h3{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--sub)}
.sec h3 button{margin-left:auto}

/* Inicio com a foto no topo (profundidade + degrade de transparencia) */
.col-a{position:relative;isolation:isolate}
.hero-foto{position:absolute;z-index:-1;pointer-events:none;top:calc(-1 * var(--sobe,90px));left:calc(-1 * var(--esq,18px));right:calc(-1 * min(var(--dir,18px),40px));height:calc(var(--sobe,90px) + 640px);background:var(--hf) 50% 22%/cover no-repeat;transform:translateY(var(--py,0px)) scale(1.06);transform-origin:50% 0;animation:heroEntra 1.4s cubic-bezier(.2,.8,.2,1) both;
 -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 40%,rgba(0,0,0,.55) 66%,rgba(0,0,0,.15) 84%,transparent 98%),linear-gradient(90deg,transparent 0%,#000 8%,#000 92%,transparent 100%);-webkit-mask-composite:source-in;
 mask-image:linear-gradient(180deg,#000 0%,#000 40%,rgba(0,0,0,.55) 66%,rgba(0,0,0,.15) 84%,transparent 98%),linear-gradient(90deg,transparent 0%,#000 8%,#000 92%,transparent 100%);mask-composite:intersect}
.hero-foto::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 62%,transparent) 0%,color-mix(in srgb,var(--bg) 18%,transparent) 20%,transparent 38%,transparent 52%,color-mix(in srgb,var(--bg) 45%,transparent) 76%,var(--bg) 100%)}
@keyframes heroEntra{from{opacity:0;transform:translateY(var(--py,0px)) scale(1.14)}}
@media(min-width:900px){.hero-foto{left:-28px!important;right:-28px!important;background-position:50% 18%;-webkit-mask-image:linear-gradient(180deg,#000 0%,#000 45%,rgba(0,0,0,.5) 70%,transparent 98%),linear-gradient(90deg,transparent 0%,#000 10%,#000 80%,transparent 100%);mask-image:linear-gradient(180deg,#000 0%,#000 45%,rgba(0,0,0,.5) 70%,transparent 98%),linear-gradient(90deg,transparent 0%,#000 10%,#000 80%,transparent 100%)}}
body.home-foto .top{background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 55%,transparent),transparent)}
.saud h1,.saud .sub{text-shadow:0 2px 14px color-mix(in srgb,var(--bg) 85%,transparent)}
/* versiculo direto sobre a foto, sem caixa */
.banner.foto-int{color:var(--txt);min-height:0;margin-top:clamp(140px,28vh,250px);padding:10px 4px 6px}
@media(min-width:900px){.banner.foto-int{margin-top:clamp(120px,26vh,240px)}}
.banner.foto-int::after,.banner.foto-int::before{display:none}
.banner.foto-int blockquote,.banner.foto-int .ref{text-shadow:0 2px 16px color-mix(in srgb,var(--bg) 90%,transparent),0 1px 2px color-mix(in srgb,var(--bg) 70%,transparent)}
.banner.foto-int .chip-d{color:var(--txt);border-color:color-mix(in srgb,var(--txt) 35%,transparent);background:color-mix(in srgb,var(--bg) 30%,transparent)}
/* bloco da proxima tarefa: vidro leve, sem cor por cima da foto */
.alerta{background:color-mix(in srgb,var(--bg) 38%,transparent)!important;border:1px solid color-mix(in srgb,var(--acc) 32%,transparent)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.14)!important;backdrop-filter:blur(14px) saturate(1.15);-webkit-backdrop-filter:blur(14px) saturate(1.15);padding:12px 14px}
.alerta::before{width:3px;opacity:.85}
.alerta.agora{animation:none}
/* 4 botoes principais mais compactos e organizados */
.principais{gap:8px;margin-top:14px}
.principal.viva{padding:9px 4px 8px;gap:5px;border-radius:18px;font-size:11.5px;box-shadow:0 10px 18px -16px var(--c2),inset 0 1px 0 rgba(255,255,255,.35)}
.principal.viva .orbe{width:34px;height:34px;padding:7px}
.principal.viva .orbe:before{inset:-4px}
.principal.viva b{font-size:11.5px;letter-spacing:.01em}
.pet-flut{width:74px;height:74px}
.pet-flut .corpo-f{font-size:38px}

/* telas largas (computador grande): tudo centralizado num bloco de 1280px */
@media(min-width:1320px){
 .nav{left:calc(50vw - 640px + 20px)!important}
 .pet-flut{right:calc(50vw - 640px + 14px)!important}
 .hero-foto{left:-140px!important;right:-40px!important;-webkit-mask-image:linear-gradient(180deg,#000 0%,#000 45%,rgba(0,0,0,.5) 70%,transparent 98%),linear-gradient(90deg,transparent 0%,#000 24%,#000 78%,transparent 100%)!important;mask-image:linear-gradient(180deg,#000 0%,#000 45%,rgba(0,0,0,.5) 70%,transparent 98%),linear-gradient(90deg,transparent 0%,#000 24%,#000 78%,transparent 100%)!important}
 #pm-intro{align-items:center!important;padding-right:0!important;padding-left:0!important}
 #pm-intro .ab-foto{inset:0 auto 0 calc(50vw - 640px)!important;width:760px!important;background-position:50% 25%!important;-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 22%,#000 66%,transparent 100%),linear-gradient(180deg,#000 0%,#000 70%,transparent 100%)!important;mask-image:linear-gradient(90deg,transparent 0%,#000 22%,#000 66%,transparent 100%),linear-gradient(180deg,#000 0%,#000 70%,transparent 100%)!important}
 #pm-intro .ab-cena{width:500px!important;margin-left:620px}
}

/* a tela nao desliza para os lados */
html,body{max-width:100%;overflow-x:clip;overscroll-behavior-x:none}
.guia-txt p{margin:0 0 10px;font-size:15px;line-height:1.5}.guia-txt p:last-child{margin:0}.guia h3{font-size:13px;letter-spacing:.08em}
.sec-h{cursor:pointer;user-select:none;-webkit-user-select:none;min-height:34px}
.sec-tg{margin-left:auto;flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;padding:0;border:1px solid var(--borda);background:var(--glass);color:var(--acc);box-shadow:0 4px 12px -8px rgba(0,0,0,.4);transition:transform .2s,background .2s}
.sec h3 button+.sec-tg,.sec h3 .btn+.sec-tg{margin-left:8px}
.sec-tg svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.sec.fechado .sec-tg svg{transform:rotate(-90deg)}
.sec-tg:active{transform:scale(.86)}
.sec-corpo{display:grid;grid-template-rows:1fr;transition:grid-template-rows .45s cubic-bezier(.2,.8,.2,1),opacity .35s}
.sec-in{min-height:0;overflow:visible}
.sec.fechado .sec-corpo{grid-template-rows:0fr;opacity:0}
.sec.fechado .sec-in{overflow:hidden}
.sec.fechado h3{margin-bottom:0}
.btn,.principal b,.info b,.info span,.info small{overflow-wrap:anywhere}
.cartao{padding:16px}
.lista{display:grid;gap:8px}
.linha{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;background:var(--glass2);border:1px solid var(--borda)}
.linha span{flex:1;min-width:0;font-size:15px;overflow-wrap:anywhere}.linha small{color:var(--sub);font-size:12px;display:block}
.linha.feito span{text-decoration:line-through;opacity:.55}
.ck{width:26px;height:26px;border-radius:9px;border:2px solid var(--acc);background:transparent;display:grid;place-items:center;flex:none;color:var(--acc-txt);padding:0}
.ck.on{background:var(--acc)}.ck svg{width:16px;height:16px;stroke-width:3;opacity:0}.ck.on svg{opacity:1}
.x{border:0;background:transparent;color:var(--sub);width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none;padding:0}
.add{display:flex;gap:8px;margin-top:10px}
input,select,textarea{width:100%;min-height:46px;padding:11px 13px;border-radius:14px;border:1px solid var(--borda);background:var(--glass2);font-size:16px;outline:none;color:var(--txt)}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--trilho)}
textarea{min-height:110px;resize:vertical;line-height:1.5}
label.campo{display:grid;gap:6px;font-size:13px;font-weight:700;color:var(--sub)}
.grade2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:14px;border:1px solid var(--borda);background:var(--glass2);font-weight:800;font-size:14px;color:var(--txt);flex:none}
.btn.p{border:0;background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--acc-txt);box-shadow:0 10px 22px -12px var(--acc)}
.btn.peq{min-height:34px;padding:0 12px;font-size:12px;border-radius:11px}
.btn.cheio{width:100%}
.vazio{color:var(--sub);font-size:14px;margin:4px 2px}
.dica{font-size:12px;color:var(--sub);line-height:1.5;margin:10px 2px 0}
/* água */
.copos{display:flex;flex-wrap:wrap;gap:8px}
.copo{width:38px;height:46px;border-radius:8px 8px 12px 12px;border:2px solid var(--acc);background:transparent;position:relative;overflow:hidden;padding:0}
.copo.on::after{content:"";position:absolute;inset:35% 0 0;background:linear-gradient(180deg,var(--acc2),var(--acc))}
/* ciclo */
.ciclo-topo{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.anel{--p:0;width:116px;height:116px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--cor,var(--acc)) calc(var(--p)*1%),var(--trilho) 0)}
.anel div{width:92px;height:92px;border-radius:50%;background:var(--glass2);display:grid;place-items:center;text-align:center}
.anel b{display:block;font:600 30px/1 var(--serif)}.anel small{font-size:11px;color:var(--sub);font-weight:700}
.fase{font:600 20px var(--serif);margin:0 0 4px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dw{font-size:11px;font-weight:800;color:var(--sub);padding:4px 0}
.cal button{aspect-ratio:1;border:0;border-radius:12px;background:transparent;font-weight:700;font-size:14px;color:var(--txt);position:relative;padding:0}
.cal button.fora{opacity:.3}
.cal button.m{background:var(--menst);color:#fff}.cal button.mp{background:color-mix(in srgb,var(--menst) 30%,transparent)}
.cal button.f{background:color-mix(in srgb,var(--fertil) 28%,transparent)}
.cal button.o{background:var(--fertil);color:#fff}
.cal button.hoje{box-shadow:inset 0 0 0 2px var(--txt)}
.cal button.reg::after{content:"";position:absolute;bottom:4px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--ovul)}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.cal-nav b{font:600 18px var(--serif);text-transform:capitalize}
.legenda{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:12px;color:var(--sub)}.legenda span{display:inline-flex;align-items:center;gap:6px}.legenda i{width:12px;height:12px;border-radius:4px;display:inline-block}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{border:1px solid var(--borda);background:var(--glass2);border-radius:30px;padding:8px 13px;font-size:13px;font-weight:700;color:var(--txt)}
.tag.on{background:var(--acc);color:var(--acc-txt);border-color:transparent}
/* treino */
.semana{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dia{display:grid;justify-items:center;gap:4px;padding:8px 0;border-radius:14px;border:1px solid var(--borda);background:var(--glass2);font-size:11px;font-weight:800;color:var(--sub)}
.dia b{font-size:15px;color:var(--txt)}.dia.hoje{border-color:var(--acc);box-shadow:0 0 0 2px var(--trilho)}.dia.feito{background:var(--acc);color:var(--acc-txt)}.dia.feito b{color:var(--acc-txt)}
.ex{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.ex small{color:var(--sub)}
/* finanças */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{padding:12px;border-radius:16px;background:var(--glass2);border:1px solid var(--borda)}
.kpi small{display:block;font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--sub);text-transform:uppercase}
.kpi b{display:block;margin-top:4px;font-size:clamp(12px,3.6vw,18px);font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--ok)}.neg{color:var(--menst)}
.barra-cat{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;font-size:13px}
/* metas */
.meta-l{display:grid;gap:8px;padding:14px;border-radius:16px;background:var(--glass2);border:1px solid var(--borda)}
.meta-l .row{display:flex;align-items:center;gap:8px}.meta-l .row b{flex:1}
/* perfil */
.temas{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tema span{font-size:12px}
.tema{border:2px solid transparent;border-radius:18px;padding:0;overflow:hidden;background:none;text-align:center;font-weight:800;font-size:13px;color:var(--txt)}
.tema i{display:block;height:84px}.tema span{display:block;padding:8px 0;background:var(--glass2)}
.tema.on{border-color:var(--acc)}
.perfil-foto{display:flex;gap:14px;align-items:center}
.perfil-foto img{width:76px;height:76px;border-radius:24px;object-fit:cover;border:3px solid var(--borda)}
/* navegação */
.nav{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(calc(100% - 24px),536px);display:grid;grid-template-columns:repeat(5,1fr);padding:7px;border-radius:26px;background:var(--nav);border:1px solid var(--borda);box-shadow:0 14px 34px -14px rgba(0,0,0,.45);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%)}
.nav button{border:0;background:transparent;display:grid;justify-items:center;gap:3px;padding:7px 0;border-radius:18px;font-size:11px;font-weight:700;color:var(--sub)}
.nav button.on{color:var(--txt);background:var(--trilho)}.nav button.on svg{color:var(--acc)}
.voltar{display:inline-flex;align-items:center;gap:6px;margin-top:6px;border:0;background:transparent;color:var(--sub);font-weight:800;font-size:13px;padding:6px 0}
dialog{border:1px solid var(--borda);border-radius:24px;padding:20px;width:min(92vw,440px);background:var(--glass2);color:var(--txt);box-shadow:0 30px 70px -20px rgba(0,0,0,.5)}
html[data-tema=sol] dialog{background:#33255f}
dialog::backdrop{background:rgba(10,8,30,.45);backdrop-filter:blur(4px)}
dialog h3{font:600 22px var(--serif);margin:0 0 12px}
.dlg-acoes{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:50;padding:11px 16px;border-radius:14px;background:var(--txt);color:var(--bg);font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:1}

/* ===== v3: vidro vivo + bichinho ===== */
.ambiente{position:fixed;inset:-6%;z-index:-1;pointer-events:none;background-size:cover;background-position:center 30%;opacity:.5;transform:scale(1.05);will-change:transform;animation:kb 40s ease-in-out infinite alternate}
html[data-tema=estrelada] .ambiente,html[data-tema=sol] .ambiente{opacity:.28}html[data-tema=lavanda] .ambiente,html[data-tema=rose] .ambiente{opacity:.3}
@keyframes kb{from{transform:scale(1.05) translate(-1%,-1%)}to{transform:scale(1.12) translate(1%,1%)}}
body{background:linear-gradient(180deg,color-mix(in srgb,var(--bg-top) 70%,transparent) 0,color-mix(in srgb,var(--bg) 72%,transparent) 340px,color-mix(in srgb,var(--bg) 80%,transparent) 100%)}
.vidro{position:relative;overflow:hidden;background:linear-gradient(135deg,color-mix(in srgb,var(--glass) 92%,transparent),color-mix(in srgb,var(--glass) 55%,transparent))}
.vidro::before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:radial-gradient(220px circle at var(--mx,30%) var(--my,0%),rgba(255,255,255,.45),transparent 60%);opacity:.55;mix-blend-mode:soft-light;transition:opacity .3s}
.vidro::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;box-shadow:inset 0 1px 0 rgba(255,255,255,.75),inset 0 -1px 0 rgba(255,255,255,.12)}
.topo-ola{display:flex;align-items:center;gap:14px;margin-top:12px}
.topo-ola h1{margin:0}
.avatar{width:66px;height:66px;border-radius:50%;flex:none;padding:3px;background:conic-gradient(from 0deg,var(--acc),var(--acc2),var(--menst),var(--acc));animation:gira 9s linear infinite;box-shadow:0 10px 24px -10px var(--acc)}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 40%;border:3px solid var(--bg);animation:gira 9s linear infinite reverse}
@keyframes gira{to{transform:rotate(360deg)}}
/* terrário */
.terrario{position:relative;margin:18px auto 0;width:min(100%,380px);aspect-ratio:1/1.02;display:grid;place-items:center}
.bolha{position:absolute;inset:0;border-radius:50%;overflow:hidden;isolation:isolate;background:var(--ceu);box-shadow:0 30px 60px -28px rgba(20,10,60,.6),inset 0 0 0 1.5px rgba(255,255,255,.55),inset 0 -30px 60px -20px rgba(255,255,255,.25)}
.bolha::before{content:"";position:absolute;inset:0;z-index:5;pointer-events:none;border-radius:50%;background:radial-gradient(60% 40% at 30% 18%,rgba(255,255,255,.65),transparent 60%),radial-gradient(30% 18% at 74% 82%,rgba(255,255,255,.25),transparent 70%),radial-gradient(circle at 50% 50%,transparent 62%,rgba(255,255,255,.28) 72%,transparent 74%)}
.bolha::after{content:"";position:absolute;inset:-30%;z-index:4;pointer-events:none;background:conic-gradient(from 0deg,transparent 0 40%,rgba(255,255,255,.18) 46%,transparent 52% 100%);animation:gira 14s linear infinite;mix-blend-mode:overlay}
.ceu-dia{--ceu:radial-gradient(circle at 70% 25%,#fff7c2 0 9%,transparent 10%),linear-gradient(180deg,#8fd0ff,#d9f0ff 70%)}
.ceu-tarde{--ceu:radial-gradient(circle at 25% 62%,#ffe08a 0 9%,transparent 10%),linear-gradient(180deg,#6b56c8,#e78fb3 55%,#ffc58a 80%)}
.ceu-noite{--ceu:radial-gradient(circle at 72% 22%,#fffbe6 0 7%,transparent 7.5%),radial-gradient(circle at 76% 19%,#1b1946 0 6.5%,transparent 7%),linear-gradient(180deg,#0f1238,#2b2366 70%)}
.ceu-manha{--ceu:radial-gradient(circle at 20% 70%,#ffd6a0 0 9%,transparent 10%),linear-gradient(180deg,#a7c8ff,#ffd9e6 70%)}
.estrelas{position:absolute;inset:0;z-index:1;background-image:radial-gradient(1.5px 1.5px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 40% 15%,#fff,transparent),radial-gradient(1.5px 1.5px at 60% 40%,#fff,transparent),radial-gradient(1px 1px at 85% 45%,#fff,transparent),radial-gradient(1px 1px at 30% 50%,#fff,transparent),radial-gradient(1.5px 1.5px at 12% 55%,#fff,transparent);animation:pisca 3s ease-in-out infinite alternate;display:none}
.ceu-noite .estrelas{display:block}
@keyframes pisca{to{opacity:.4}}
.nuvem{position:absolute;z-index:1;width:30%;height:9%;top:var(--t);left:-35%;border-radius:40px;background:rgba(255,255,255,.75);filter:blur(1px);animation:passa var(--d) linear infinite;animation-delay:var(--dl)}
.nuvem::before{content:"";position:absolute;width:50%;height:150%;left:20%;top:-60%;border-radius:50%;background:inherit}
.ceu-noite .nuvem{opacity:.12}
@keyframes passa{to{left:110%}}
.chao{position:absolute;z-index:2;left:-10%;right:-10%;bottom:-8%;height:36%;border-radius:50% 50% 0 0;background:radial-gradient(ellipse at 50% 0,#9ee39a,#4fb37a 60%,#2f8a63)}
.ceu-noite .chao{background:radial-gradient(ellipse at 50% 0,#3e6f6a,#1f4a4a 60%,#163636)}
.ceu-tarde .chao{background:radial-gradient(ellipse at 50% 0,#c6e39a,#7bb36f 60%,#4a8a5a)}
.flor{position:absolute;z-index:3;bottom:var(--b);left:var(--l);font-size:var(--s);animation:balanca 3s ease-in-out infinite alternate;transform-origin:bottom}
@keyframes balanca{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.particulas i{position:absolute;z-index:3;bottom:30%;left:var(--l);width:6px;height:6px;border-radius:50%;background:var(--pc,#fff8);animation:sobe var(--d) ease-in infinite;animation-delay:var(--dl);opacity:0}
.ceu-noite .particulas i{--pc:#fff36b;box-shadow:0 0 8px #fff36b}
@keyframes sobe{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translate(14px,-120px)}}
.bicho{position:relative;z-index:6;display:grid;place-items:center;margin-top:18%;cursor:pointer;-webkit-user-select:none;user-select:none;transition:transform .4s cubic-bezier(.3,1.6,.5,1)}
.bicho .corpo{font-size:110px;line-height:1;filter:drop-shadow(0 14px 10px rgba(0,0,0,.25));animation:respira 2.6s ease-in-out infinite;display:block}
.bicho img.corpo{width:118px;height:auto}
.bicho .acc{position:absolute;font-size:34px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.25))}
.bicho .sombra{position:absolute;bottom:-8px;width:60%;height:14px;border-radius:50%;background:rgba(0,0,0,.22);filter:blur(3px);animation:sombra 2.6s ease-in-out infinite}
@keyframes respira{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-8px) scale(1.02,.98)}}
@keyframes sombra{50%{transform:scale(.85);opacity:.7}}
.bicho.pula{transform:translateY(-34px) rotate(-6deg)}
.bicho.dorme .corpo{animation:dorme 4s ease-in-out infinite;filter:brightness(.8) drop-shadow(0 10px 8px rgba(0,0,0,.3))}
@keyframes dorme{50%{transform:scale(1.03,.96)}}
.bicho.doente .corpo{filter:grayscale(.7) brightness(.9) drop-shadow(0 10px 8px rgba(0,0,0,.25));animation-duration:5s}
.zzz{position:absolute;z-index:7;top:-6%;right:8%;font-weight:800;color:#fff;font-size:22px;animation:zzz 2.4s ease-in-out infinite;text-shadow:0 2px 6px #0006}
@keyframes zzz{0%{opacity:0;transform:translate(0,10px) scale(.7)}50%{opacity:1}100%{opacity:0;transform:translate(16px,-26px) scale(1.2)}}
.ovo{position:relative;width:118px;height:148px;border-radius:50% 50% 48% 48%/58% 58% 42% 42%;background:radial-gradient(circle at 35% 28%,#fff 0 12%,transparent 40%),radial-gradient(circle at 30% 60%,var(--c1) 0 8%,transparent 9%),radial-gradient(circle at 68% 42%,var(--c1) 0 10%,transparent 11%),radial-gradient(circle at 55% 78%,var(--c2) 0 7%,transparent 8%),linear-gradient(160deg,#fffaf0,#f1e3c9);box-shadow:inset -10px -14px 24px rgba(0,0,0,.12),0 16px 14px -6px rgba(0,0,0,.25);animation:balanca-ovo 3s ease-in-out infinite;transform-origin:50% 90%}
.ovo svg{position:absolute;inset:0;width:100%;height:100%}
@keyframes balanca-ovo{0%,70%,100%{transform:rotate(0)}76%{transform:rotate(-7deg)}82%{transform:rotate(6deg)}88%{transform:rotate(-3deg)}}
.fala{position:absolute;z-index:8;top:6%;left:50%;transform:translateX(-50%);max-width:82%;padding:9px 13px;border-radius:16px;background:rgba(255,255,255,.92);color:#2a2340;font-weight:800;font-size:13px;text-align:center;box-shadow:0 8px 18px -8px rgba(0,0,0,.4);opacity:0;transition:opacity .3s,transform .3s;pointer-events:none}
.fala.on{opacity:1;transform:translateX(-50%) translateY(-4px)}
.coracao{position:absolute;z-index:9;font-size:22px;pointer-events:none;animation:coracao 1.1s ease-out forwards}
@keyframes coracao{to{transform:translate(var(--x),-110px) scale(1.4);opacity:0}}
.pet-info{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.pet-info b{font:600 22px var(--serif)}.pet-info small{color:var(--sub);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.nivel{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:30px;background:var(--trilho);font-weight:800;font-size:12px;color:var(--acc)}
.barras{display:grid;gap:10px;margin-top:12px;padding:14px 16px}
.barra{display:grid;grid-template-columns:86px 1fr 38px;align-items:center;gap:10px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--sub)}
.barra b{text-align:right;color:var(--txt);font-size:12px}
.liq{position:relative;height:14px;border-radius:10px;background:var(--trilho);overflow:hidden}
.liq i{position:absolute;inset:0 auto 0 0;border-radius:10px;background:linear-gradient(90deg,var(--c,var(--acc)),color-mix(in srgb,var(--c,var(--acc)) 55%,#fff));transition:width .8s cubic-bezier(.3,1.3,.5,1);overflow:hidden}
.liq i::after{content:"";position:absolute;inset:0;width:200%;background:repeating-linear-gradient(110deg,transparent 0 10px,rgba(255,255,255,.35) 10px 14px);animation:onda 1.6s linear infinite}
@keyframes onda{to{transform:translateX(-50%)}}
.xp{margin-top:6px}
.acoes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.acao{display:grid;justify-items:center;gap:6px;padding:14px 4px 12px;border-radius:20px;font-weight:800;font-size:12px;color:inherit;transform-style:preserve-3d;transition:transform .15s}
.acao span{font-size:28px;filter:drop-shadow(0 6px 6px rgba(0,0,0,.22));transition:transform .3s cubic-bezier(.3,1.8,.5,1)}
.acao:active{transform:scale(.94)}.acao:active span{transform:translateY(-6px) scale(1.15)}
.acao.ok{outline:2px solid var(--ok);outline-offset:-2px}
.confete{position:fixed;z-index:60;top:-10px;pointer-events:none;font-size:20px;animation:cai var(--d) linear forwards}
@keyframes cai{to{transform:translate(var(--x),105vh) rotate(540deg)}}
.flash{position:fixed;inset:0;z-index:70;pointer-events:none;background:radial-gradient(circle,#fff,rgba(255,255,255,0) 70%);animation:flash 1.2s ease-out forwards}
@keyframes flash{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.album div{display:grid;justify-items:center;gap:4px;padding:12px 6px;border-radius:16px;background:var(--glass2);border:1px solid var(--borda);text-align:center;font-size:12px}
.album span{font-size:36px}.album img{width:46px}

/* blocos do dia */
.blocos-dia{margin-top:14px;padding:16px 14px 14px;border-radius:22px}
.bd-topo{display:flex;justify-content:space-between;font:800 11px var(--mono,ui-monospace,'SFMono-Regular',Menlo,monospace);letter-spacing:.14em;color:var(--sub);text-transform:uppercase}
.bd-tit{font:800 30px/1.1 var(--sans);letter-spacing:-.02em;margin:6px 0 12px}
.linha-tempo{position:relative;margin-left:38px;border-left:1.5px solid color-mix(in srgb,var(--sub) 35%,transparent)}
.hora{position:absolute;left:-38px;width:30px;text-align:right;font:700 10px ui-monospace,Menlo,monospace;color:var(--sub);transform:translateY(-50%)}
.bloco-t{position:absolute;left:10px;right:0;border-radius:10px;border:1.5px solid var(--bc);background:color-mix(in srgb,var(--bc) 16%,var(--glass2) 40%);padding:7px 34px 6px 10px;text-align:left;color:var(--txt);overflow:hidden;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;font:inherit;transition:transform .15s,opacity .3s}
.bloco-t b{display:block;font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bloco-t small{display:block;font:600 11px ui-monospace,Menlo,monospace;color:var(--sub);margin-top:2px;white-space:nowrap}
.bloco-t.feito{opacity:.55}.bloco-t.feito b{color:var(--sub)}
.bloco-t .ok{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--txt);opacity:0}
.bloco-t.feito .ok{opacity:.8}
.bloco-t.agora{box-shadow:0 0 0 2px color-mix(in srgb,var(--bc) 50%,transparent),0 10px 24px -12px var(--bc);opacity:1}
.bloco-t.atras:not(.feito){border-style:dashed}
.bloco-t:active{transform:scale(.98)}
.bloco-t .ed{position:absolute;right:4px;top:4px;width:26px;height:26px;border:0;border-radius:8px;background:transparent;color:var(--sub);display:grid;place-items:center;padding:0}
.bloco-t.feito .ed{display:none}
.agora-linha{position:absolute;left:-6px;right:-14px;height:0;border-top:2px solid #ff5a6a;z-index:5;pointer-events:none;transition:top 1s linear}
.agora-linha::before{content:"";position:absolute;left:-6px;top:-7px;width:12px;height:12px;border-radius:50%;background:#ff5a6a;box-shadow:0 0 0 4px rgba(255,90,106,.25);animation:pulso 2s ease-in-out infinite}
.agora-linha span{position:absolute;right:0;top:-18px;font:800 11px ui-monospace,Menlo,monospace;color:#ff5a6a;background:var(--glass2);padding:1px 5px;border-radius:6px}
@keyframes pulso{50%{box-shadow:0 0 0 9px rgba(255,90,106,0)}}
.bd-rodape{display:flex;justify-content:space-between;gap:10px;margin-top:12px;font:800 11px ui-monospace,Menlo,monospace;letter-spacing:.1em;color:var(--sub);text-transform:uppercase}
.cores{display:flex;gap:8px;flex-wrap:wrap}.cores label{position:relative}.cores input{position:absolute;opacity:0}.cores span{display:block;width:34px;height:34px;border-radius:50%;background:var(--c);border:3px solid transparent}.cores input:checked+span{border-color:var(--txt)}

/* ===== v4: botões, flutuante, banner, árvore, bíblia ===== */

.banner.foto-int::before{z-index:0;inset:-10px -14px;background:radial-gradient(120% 100% at 50% 30%,transparent 30%,rgba(8,6,10,.55) 80%),linear-gradient(180deg,transparent 30%,rgba(8,6,10,.55));-webkit-mask-image:radial-gradient(120% 100% at 50% 42%,#000 50%,transparent 97%);mask-image:radial-gradient(120% 100% at 50% 42%,#000 50%,transparent 97%)}
.banner.foto-int blockquote,.banner.foto-int .ref{text-shadow:0 2px 12px rgba(0,0,0,.6)}
.avatar img{-webkit-mask-image:radial-gradient(circle,#000 62%,rgba(0,0,0,.75) 78%,transparent 100%);mask-image:radial-gradient(circle,#000 62%,rgba(0,0,0,.75) 78%,transparent 100%)}
.banner .chip-d{align-self:flex-start;padding:6px 11px;border-radius:30px;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}

.principais{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.principal{position:relative;overflow:hidden;display:grid;justify-items:center;gap:6px;padding:14px 4px 12px;border-radius:22px;border:1px solid rgba(255,255,255,.55);color:#fff;font-weight:800;font-size:12px;background:linear-gradient(150deg,var(--c1),var(--c2));box-shadow:0 14px 24px -14px var(--c2),inset 0 1px 0 rgba(255,255,255,.6),inset 0 -3px 0 rgba(0,0,0,.1);text-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}

.principal::after{content:"";position:absolute;top:0;bottom:0;left:-70%;width:45%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);animation:brilhoBtn 5s ease-in-out infinite;animation-delay:var(--dl,0s)}
.principal:active{transform:scale(.94)}.principal:active span{transform:translateY(-5px) scale(1.15)}

.info .ii{font-size:22px}.info small{color:var(--sub);font-weight:800;font-size:10px;letter-spacing:.14em;text-transform:uppercase}.info b{font-size:15px;line-height:1.25}.info span{color:var(--sub);font-size:12px;line-height:1.35}

/* árvore */
.arvore{margin-top:14px;padding:14px;border-radius:24px;text-align:center}

.fruto{cursor:pointer}.fruto .bt{fill:var(--glass2);stroke:var(--acc);stroke-width:2}

.plano{padding:16px;display:grid;gap:10px}
.plano-h{display:flex;align-items:center;gap:12px}.plano-h .ii{font-size:30px}.plano-h div{flex:1;min-width:0}.plano-h b{display:block;font:600 19px var(--serif)}.plano-h small{color:var(--sub);font-size:12px;font-weight:700}

.ler-nav{display:flex;gap:8px;justify-content:space-between;margin-top:12px}

.cad-card{padding:26px 20px 22px;border-radius:30px;position:relative}

.cad-orb .aro{position:absolute;inset:0;border-radius:50%;border:1px solid color-mix(in srgb,var(--acc) 45%,transparent);animation:gira 30s linear infinite}

.pw{position:relative;display:block}.pw input{padding-right:52px}

.kpi{text-align:left;color:inherit;font:inherit;cursor:pointer}.kpi.sel{outline:2px solid var(--acc)}

/* ===== Inicio vivo (31/10/2026) ===== */
.vi{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.vi *{transform-box:fill-box}
.vi-agua .nivel{animation:viNivel 3.2s ease-in-out infinite alternate}
.vi-agua .brilho-g{opacity:.7}
@keyframes viNivel{from{transform:translateY(5px)}to{transform:translateY(-3px)}}
.vi-livro .pagina{transform-origin:0 50%;animation:viPagina 3.6s ease-in-out infinite}
@keyframes viPagina{0%,55%,100%{transform:scaleX(1)}70%{transform:scaleX(-1)}85%{transform:scaleX(1)}}
.vi-treino .pulso{stroke-dasharray:44;stroke-dashoffset:44;animation:viPulso 2.2s ease-in-out infinite}
.vi-treino>path:first-child{transform-origin:50% 60%;animation:viBate 1.1s ease-in-out infinite}
@keyframes viPulso{0%{stroke-dashoffset:44}55%,100%{stroke-dashoffset:-44}}
@keyframes viBate{0%,100%{transform:scale(1)}15%{transform:scale(1.08)}30%{transform:scale(1)}45%{transform:scale(1.05)}}
.vi-rotina .folha-e{transform-origin:100% 100%;animation:viFolhaE 3s ease-in-out infinite alternate}
.vi-rotina .folha-d{transform-origin:0 100%;animation:viFolhaD 3.4s ease-in-out infinite alternate}
@keyframes viFolhaE{from{transform:rotate(-6deg)}to{transform:rotate(8deg)}}
@keyframes viFolhaD{from{transform:rotate(6deg)}to{transform:rotate(-8deg)}}
.vi-relogio .ponteiro{transform-origin:50% 100%;animation:viGira 6s linear infinite}

/* Estilo C · Cores vivas (Wayna) */
html.estilo-c{--serif:'Inter',system-ui,sans-serif;--sans:'Inter',system-ui,sans-serif;--bg:#f3effa;--bg-top:#f3effa;--txt:#1f1640;--sub:#7d6fa6;--glass:#fff;--glass2:#fff;--borda:transparent;--sombra:0 8px 22px -14px rgba(106,63,209,.35);--acc:#6a3fd1;--acc2:#e46fa3;--acc-txt:#fff;--trilho:#efe9fb;--nav:#1f1640;--ok:#1e9a5a}

html.estilo-c body::after,html.estilo-c .ambiente{display:none!important}
html.estilo-c .vidro{background:#fff!important;border:0!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;border-radius:22px;box-shadow:0 8px 22px -16px rgba(106,63,209,.45)}

html.estilo-c h1,html.estilo-c h2,html.estilo-c h3,html.estilo-c .tit,html.estilo-c blockquote,html.estilo-c b{font-family:Inter,system-ui,sans-serif!important}
html.estilo-c .tit{font-weight:800;letter-spacing:-.02em}
html.estilo-c .btn.p{background:#6a3fd1!important;color:#fff!important;border:0;box-shadow:none}
html.estilo-c .btn{border-radius:14px}
html.estilo-c .nav{background:#1f1640!important;border:0!important;border-radius:32px}html.estilo-c .nav button{color:#8f80c4}html.estilo-c .nav button.on{color:#fff!important;background:#6a3fd1!important}html.estilo-c .nav button.on svg{color:#fff!important}
html.estilo-c .top{background:transparent!important}html.estilo-c .top>b{opacity:0}
html.estilo-c .gnav{background:#fff!important;border:0!important;box-shadow:0 6px 16px -10px #6a3fd155}html.estilo-c .gnav button.on{background:#6a3fd1!important;color:#fff}
html.estilo-c dialog{background:#fff!important;color:#1f1640;border-radius:24px}
html.estilo-c input,html.estilo-c select,html.estilo-c textarea{font-family:Inter,system-ui,sans-serif}

.c-eq{background:#3fb878;color:#fff}.c-fe{background:#e46fa3;color:#fff}.c-eq small,.c-fe small{opacity:.85;letter-spacing:.1em;margin-top:6px}.c-eq b,.c-fe b{display:block;font-size:17px;margin-top:4px}.c-eq span,.c-fe span{font-size:12px;opacity:.92}.c-eq svg,.c-fe svg{width:24px;height:24px}

@media (min-width:900px){.c-home{max-width:780px}.c-bento{grid-template-columns:1fr 1fr 1fr;grid-template-areas:"agora agora nota" "vendas vendas habs" "eq fe fe"}.c-agora{grid-area:agora}.c-nota{grid-area:nota}.c-habs{grid-area:habs;align-content:center}.c-vendas{grid-area:vendas}.c-eq{grid-area:eq}.c-fe{grid-area:fe}.c-mais{grid-template-columns:repeat(3,1fr)}}

function blocosDe(d){const w=parse(d).getDay();return S.blocos.filter(b=>b.dias.includes(w)).sort((a,b)=>a.ini.localeCompare(b.ini))}
function rotinaHoje(){const h=hoje();const tar=S.tarefas.filter(t=>!t.feito||t.feito===h);const hd=S.habDias[h]||{};const bl=blocosDe(h);const bf=S.blocosFeitos[h]||{};
 const total=tar.length+S.habitos.length+bl.length;const feitos=tar.filter(t=>t.feito===h).length+S.habitos.filter(x=>hd[x.id]).length+bl.filter(b=>bf[b.id]).length;return {tar,total,feitos,bl,bf}}
function ciclo(){const c=S.ciclo;if(!c.inicios.length)return null;const ini=c.inicios.slice().sort();const ult=ini[ini.length-1];
 const dur=duracaoMedia();const h=hoje();let prox=somaDias(ult,dur);while(difDias(prox,h)>0)prox=somaDias(prox,dur);
 const diaCiclo=((difDias(ult,h)%dur)+dur)%dur+1;const ovul=somaDias(prox,-14);const fIni=somaDias(ovul,-5),fFim=somaDias(ovul,1);
 const inicioAtual=somaDias(prox,-dur);const ovAtual=somaDias(inicioAtual,dur-14);
 let fase='Fase lútea',cor='var(--ovul)';
 if(diaCiclo<=c.menst){fase='Menstruação';cor='var(--menst)'}else if(h===ovAtual){fase='Dia provável da ovulação';cor='var(--fertil)'}
 else if(difDias(somaDias(ovAtual,-5),h)>=0&&difDias(h,somaDias(ovAtual,1))>=0){fase='Período fértil';cor='var(--fertil)'}else if(difDias(h,ovAtual)>0){fase='Fase folicular';cor='var(--acc)'}
 return {ult,dur,prox,diaCiclo,ovul,fIni,fFim,fase,cor,faltam:difDias(h,prox),fertilEm:difDias(h,fIni)}}
function duracaoMedia(){const i=S.ciclo.inicios.slice().sort();const d=[];for(let k=1;k<i.length;k++){const x=difDias(i[k-1],i[k]);if(x>=18&&x<=45)d.push(x)}const u=d.slice(-6);return u.length?Math.round(u.reduce((a,b)=>a+b,0)/u.length):S.ciclo.duracao}
function tipoDia(s){const c=S.ciclo;if(!c.inicios.length)return '';const dur=duracaoMedia();const ini=c.inicios.slice().sort();
 for(const i of ini){const k=difDias(i,s);if(k>=0&&k<c.menst)return 'm'}
 const ult=ini[ini.length-1];if(difDias(ult,s)<0)return '';
 const k=difDias(ult,s)%dur;const base=somaDias(s,-k);if(difDias(ult,s)>=dur&&k<c.menst)return 'mp';
 const ov=somaDias(base,dur-14);if(s===ov)return 'o';if(difDias(somaDias(ov,-5),s)>=0&&difDias(s,somaDias(ov,1))>=0)return 'f';return ''}
function treinoHoje(){const dw=new Date().getDay();return S.treino.plano[dw]||{n:'Descanso',ex:[]}}
function lembretes(){const L=[];const h=hoje();const r=rotinaHoje();const ag=(S.agua[h]||0);
 if(ag<S.meta_agua)L.push(['gota','Beber água',ag+' de '+S.meta_agua+' copos hoje','rotina']);
 S.agenda.filter(a=>a.d===h&&!a.ok).forEach(a=>L.push(['cal',a.t,(a.h?a.h+' · ':'')+'hoje','rotina']));
 const c=ciclo();if(c){if(c.faltam>=0&&c.faltam<=3)L.push(['flor','Menstruação chegando',c.faltam===0?'prevista para hoje':'prevista em '+c.faltam+' dia(s)','ciclo']);if(c.fertilEm>=0&&c.fertilEm<=2)L.push(['flor','Período fértil',c.fertilEm===0?'começa hoje':'começa em '+c.fertilEm+' dia(s)','ciclo'])}
 const tr=treinoHoje();if(tr.ex.length&&!S.treino.feitos.includes(h))L.push(['halter',tr.n,'treino de hoje','treino']);
 if(r.total-r.feitos>0)L.push(['rotina','Rotina de hoje','faltam '+(r.total-r.feitos)+' item(ns)','rotina']);
 if(Date.now()-(S.ultimaCopia||0)>7*864e5)L.push(['nuvem','Fazer cópia de segurança','seus dados ficam só neste aparelho','perfil']);if(window.LT_VENDAS){const nw=new Date();if(nw.getDay()!==0&&nw.getHours()>=17&&!VD.base().dias[h])L.push(['grafico','Lançar as vendas de hoje','venda e clientes do dia','vendas'])}if(window.LT_EQUIPE&&EQ.d)(EQ.d.agenda||[]).filter(x=>x.data>=h&&x.data<=dstr(new Date(Date.now()+864e5))).forEach(x=>L.push(['equipe',x.titulo,x.data===h?'equipe · hoje':'equipe · amanhã','equipe']));return L}

 const tr=S.treino.feitos.includes(d);const fe=!!S.fe[d];return ag*2+tar*5+hab*5+(tr?15:0)+(fe?5:0)}

 const fe=S.fe[d]?1:0;const hab=S.habitos.length?Object.values(S.habDias[d]||{}).filter(Boolean).length/S.habitos.length:1;const bl=blocosDe(d),bf=S.blocosFeitos[d]||{};const tar=bl.length?bl.filter(b=>bf[b.id]).length/bl.length:(S.tarefas.some(t=>t.feito===d)?1:0);

 const ini=Math.min(6,...bl.map(b=>Math.floor(minDe(b.ini)/60)))*60;const fim=Math.max(22,...bl.map(b=>Math.ceil(minDe(b.fim)/60)))*60;const alt=(fim-ini)/60*PXH;

 const feitos=bl.filter(b=>bf[b.id]).length;const prox=bl.find(b=>!bf[b.id]&&minDe(b.ini)>agora);const c=ciclo();
 const cards=bl.map(b=>{const a=minDe(b.ini),z=minDe(b.fim);const top=y(a)+2,hh=Math.max(30,y(z)-y(a)-4);const dur=(z-a)/60;const now=agora>=a&&agora<z;const atr=agora>=z;

 const tira=()=>{el.classList.remove('on');setTimeout(()=>el.remove(),400)};el.addEventListener('click',tira);setTimeout(tira,12000);
 try{if('Notification' in window&&Notification.permission==='granted'&&navigator.serviceWorker&&navigator.serviceWorker.ready)navigator.serviceWorker.ready.then(r=>r.showNotification('Life Trail',{body:e.t,tag:e.id,icon:'icon-192.png'})).catch(()=>{})}catch(x){}}
function checarLembretes(){if(!S)return;const dt=new Date();const agora=dt.getHours()*60+dt.getMinutes();
 eventosHoje().forEach(e=>{const m=minDe(e.hora);if(agora>=m&&agora<m+20&&!LEMB_VISTOS.has(e.id)&&!(S.lembVistos||{})[e.id]){LEMB_VISTOS.add(e.id);S.lembVistos=S.lembVistos||{};S.lembVistos[e.id]=1;try{localStorage.setItem(CHAVE,JSON.stringify(S))}catch(x){}avisar(e)}})}
setInterval(checarLembretes,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden){checarLembretes();if(window.NUVEM&&NUVEM.ativo())NUVEM.puxar()}});

function proximaTarefa(){const h=hoje();const dt=new Date();const ag=dt.getHours()*60+dt.getMinutes();const bf=S.blocosFeitos[h]||{};const bl=blocosDe(h);
 const atras=bl.filter(b=>!bf[b.id]&&minDe(b.fim)<=ag);
 const b=bl.find(b=>!bf[b.id]&&minDe(b.fim)>ag);
 const cmp=S.agenda.filter(a=>a.d===h&&a.h&&!a.ok&&minDe(a.h)>=ag-30).sort((x,y)=>x.h.localeCompare(y.h))[0];
 let it=null;
 if(b&&(!cmp||minDe(b.ini)<=minDe(cmp.h)))it={tipo:'bloco',id:b.id,t:b.t,ini:b.ini,fim:b.fim,m:minDe(b.ini)};
 else if(cmp)it={tipo:'agenda',id:cmp.id,t:cmp.t,ini:cmp.h,m:minDe(cmp.h)};
 else{const t=S.tarefas.find(t=>!t.feito);if(t)it={tipo:'tarefa',id:t.id,t:t.t}}
 return {it,atras,ag}}

  <div class="grade2" style="margin-top:12px"><button class="btn p" data-acao="copia">${ic('nuvem')} Fazer cópia</button><button class="btn" data-acao="restaurar">Restaurar</button></div></div></div>
 ${PREVIA?`<div class="sec"><h3>Só na prévia: testar bichinho</h3><div class="vidro cartao grade2"><select id="demo-esp">${Object.keys(ESP).map(k=>`<option value="${k}" ${k===S.pet.esp?'selected':''}>${ESP[k].n}</option>`).join('')}</select><select id="demo-fase">${FASES.map((f,i)=>`<option value="${f[1]+5}" ${faseDe(xp())===i?'selected':''}>${f[0]}</option>`).join('')}</select></div></div>`:''}<div class="sec"><h3>Meus bichinhos</h3><div class="album"><div><span>${ESP[S.pet.esp].img?`<img src="${PET_ARNOLD}" alt="">`:(faseDe(xp())?ESP[S.pet.esp].e[Math.max(0,faseDe(xp())-1)]:'')}</span><b>${esc(nomePet())}</b><small>agora</small></div>${S.album.slice().reverse().map(p=>`<div><span>${ESP[p.esp].img?`<img src="${PET_ARNOLD}" alt="">`:ESP[p.esp].e[5]}</span><b>${esc(p.nome)}</b><small>${esc(p.como)}</small></div>`).join('')}</div>${S.pet.esp==='arnold'||faseDe(xp())===0?'':`<label class="campo" style="margin-top:10px">Nome do bichinho<input id="nome-pet" value="${esc(S.pet.nome)}" maxlength="20"></label>`}</div>
 <div class="sec"><h3>Senha e lembretes</h3><div class="vidro cartao" style="display:grid;gap:10px"><p class="sub" style="font-size:14px"> Seus dados ficam salvos neste aparelho, protegidos pela sua senha.</p>
 <button class="btn" data-acao="notif"><span class="tag-ic">${VI.sino}</span>Permitir notificações no celular</button><p class="dica" style="margin:0">Os lembretes aparecem na tela enquanto o app está aberto. No iPhone, as notificações só funcionam com o app instalado na tela de início.</p>

function dlg(html,ok){const d=$('#dlg');d.innerHTML=html;d.showModal();const f=d.querySelector('form');if(f)f.onsubmit=e=>{e.preventDefault();if(ok(new FormData(f))!==false){d.close();salvar();render()}};d.querySelectorAll('[data-fechar]').forEach(b=>b.onclick=()=>d.close())}
const num=v=>parseFloat(String(v).replace(/\./g,'').replace(',','.'))||0;

 case 'fe-ok':if(!S.fe[h]){S.fe[h]=true;confete(['','','','']);toast(nomePet()+' ficou mais feliz ')}break;
 case 'pet':{const el=a;el.classList.add('pula');setTimeout(()=>el.classList.remove('pula'),380);const fl=$('#fala');if(fl){const L=fala();fl.textContent=L[Math.floor(Math.random()*L.length)];fl.classList.add('on');clearTimeout(fl._t);fl._t=setTimeout(()=>fl.classList.remove('on'),2400)}
  const t=a.closest('.terrario');for(let k=0;k<4;k++){const c=document.createElement('span');c.className='coracao';c.textContent=['','','',''][k];c.style.left=(40+Math.random()*20)+'%';c.style.top='48%';c.style.setProperty('--x',(Math.random()*80-40)+'px');t.append(c);setTimeout(()=>c.remove(),1200)}return}
 case 'tarefa':{const t=S.tarefas.find(x=>x.id===id);t.feito=t.feito?null:h;if(t.feito)toast(nomePet()+' ficou mais feliz ');break}
 case 'tarefa-x':S.tarefas=S.tarefas.filter(x=>x.id!==id);break;
 case 'habito':{const d=S.habDias[h]=S.habDias[h]||{};d[id]=!d[id];break}
 case 'habito-x':S.habitos=S.habitos.filter(x=>x.id!==id);break;
 case 'agenda':{const x=S.agenda.find(y=>y.id===id);x.ok=!x.ok;break}
 case 'agenda-x':S.agenda=S.agenda.filter(x=>x.id!==id);break;
 case 'menst-hoje':if(!S.ciclo.inicios.includes(h))S.ciclo.inicios.push(h);calMes=h.slice(0,7);toast('Registrado. Ciclo recalculado.');break;
 case 'inicio-x':if(S.ciclo.inicios.length<=1){toast('Mantenha pelo menos um registro');return}S.ciclo.inicios=S.ciclo.inicios.filter(x=>x!==v);break;
 case 'sintoma':{const r=S.ciclo.diario[h]=S.ciclo.diario[h]||{s:[],h:''};r.s=r.s.includes(v)?r.s.filter(x=>x!==v):r.s.concat(v);break}
 case 'humor':{const r=S.ciclo.diario[h]=S.ciclo.diario[h]||{s:[],h:''};r.h=r.h===v?'':v;break}
 case 'cal-mes':{const [y,m]=calMes.split('-').map(Number);const d=new Date(y,m-1+(+v),1);calMes=d.getFullYear()+'-'+pad(d.getMonth()+1);break}
 case 'cal-dia':{const r=S.ciclo.diario[v];const t=tipoDia(v);toast(fmtData(v,{day:'numeric',month:'long'})+': '+({m:'menstruação',mp:'menstruação prevista',f:'período fértil',o:'ovulação provável'}[t]||'sem previsão')+(r&&(r.s.length||r.h)?' · '+[r.h].concat(r.s).filter(Boolean).join(', '):''));return}
 case 'ciclo-editar':dlg(`<h3>Ajustar ciclo</h3><form style="display:grid;gap:10px"><label class="campo">Adicionar início de menstruação<input type="date" name="d" max="${h}"></label><div class="grade2"><label class="campo">Ciclo (dias)<input type="number" name="dur" min="18" max="45" value="${S.ciclo.duracao}"></label><label class="campo">Menstruação (dias)<input type="number" name="m" min="2" max="10" value="${S.ciclo.menst}"></label></div><p class="dica">A duração do ciclo é calculada pelo histórico quando há dois registros ou mais.</p><div class="dlg-acoes"><button type="button" class="btn" data-fechar>Cancelar</button><button class="btn p">Salvar</button></div></form>`,f=>{const d=f.get('d');if(d&&!S.ciclo.inicios.includes(d))S.ciclo.inicios.push(d);S.ciclo.duracao=+f.get('dur')||28;S.ciclo.menst=+f.get('m')||5});return;
 case 'ex':{const c=S.treino.checks[h]=S.treino.checks[h]||{};c[a.dataset.i]=!c[a.dataset.i];break}
 case 'treino-ok':if(S.treino.feitos.includes(h))S.treino.feitos=S.treino.feitos.filter(x=>x!==h);else{S.treino.feitos.push(h);const hd=S.habDias[h]=S.habDias[h]||{};const th=S.habitos.find(x=>/trein/i.test(x.t));if(th)hd[th.id]=true;toast('Treino concluído!  '+nomePet()+' cresceu um pouco');confete(['','','',''])}break;
 case 'treino-editar':{const dias=[1,2,3,4,5,6,0],nomes=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
  dlg(`<h3>Editar treino</h3><form style="display:grid;gap:12px;max-height:68vh;overflow:auto">${dias.map(d=>{const p=S.treino.plano[d]||{n:'',ex:[]};return `<fieldset style="border:0;padding:0;margin:0;display:grid;gap:6px"><label class="campo">${nomes[d]}<input name="n${d}" value="${esc(p.n)}" placeholder="Ex.: Treino A · Pernas ou Descanso"></label><textarea name="e${d}" placeholder="Um exercício por linha. Ex.: Agachamento - 4x12" aria-label="Exercícios de ${nomes[d]}">${esc(p.ex.map(x=>x.n+(x.s?' - '+x.s:'')).join('\n'))}</textarea></fieldset>`}).join('')}<div class="dlg-acoes"><button type="button" class="btn" data-fechar>Cancelar</button><button class="btn p">Salvar treino</button></div></form>`,
  f=>{dias.forEach(d=>{const ex=String(f.get('e'+d)||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const [n,...s]=l.split(/\s+-\s+/);return {n:n.trim(),s:s.join(' - ').trim()}});S.treino.plano[d]={n:String(f.get('n'+d)||'').trim()||(ex.length?'Treino':'Descanso'),ex}});S.treino.provisorio=false});return}
 case 'bloco':{if(e.target.closest('[data-acao=bloco-ed]'))return;const f=S.blocosFeitos[h]=S.blocosFeitos[h]||{};f[id]=!f[id];if(f[id]){const b=S.blocos.find(x=>x.id===id);toast((b?b.t:'Bloco')+' concluído  '+nomePet()+' ficou feliz')}break}

 case 'trocar-senha':localStorage.removeItem('lifetrail_wayna_senha');localStorage.removeItem('lifetrail_wayna_lembrar');NUVEM.telaCriarSenha(true,()=>{});return;
 case 'nav-voltar':if(HIST.b.length){HIST.f.push(tela);porHist=true;ir(HIST.b.pop())}return;

  const it=itensArvore(h);if(it.length&&it.every(i=>i.ok))setTimeout(()=>confete(['','','','','']),200);break}
 case 'tarefa-ed':{const t=S.tarefas.find(x=>x.id===id);editarTexto('Editar tarefa',t.t,f=>{t.t=String(f.get('v')).trim()});return}
 case 'habito-ed':{const x=S.habitos.find(y=>y.id===id);editarTexto('Editar hábito',x.t,f=>{x.t=String(f.get('v')).trim()});return}

 case 'anual-comecar':B().anual={inicio:h,dias:{}};toast('Plano anual começou hoje! ');break;
 case 'anual-reiniciar':dlg(`<h3>Recomeçar o plano?</h3><p class="sub">O progresso do plano anual volta para o dia 1.</p><div class="dlg-acoes"><button class="btn" data-fechar>Cancelar</button><button class="btn p" data-acao="anual-comecar" data-fechar>Recomeçar</button></div>`,()=>{});return;
 case 'ler-ok':{if(!leitura)return;const b=B();if(leitura.chave==='salmos')b.salmos[leitura.refs[0][1]]=h;else if(leitura.chave==='prov')b.prov[h]=true;else if(leitura.chave==='anual')b.anual.dias[leitura.dia]=h;const l=leitura.refs[leitura.refs.length-1];b.ult={b:l[0],c:l[1]};
  if(!S.fe[h]){S.fe[h]=true;confete(['','','',''])}toast('Leitura concluída  '+nomePet()+' ficou feliz');break}

 case 'hist':histTipo=v;break;
