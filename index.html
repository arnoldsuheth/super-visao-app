<link rel="stylesheet" href="./app.css?v=mwv490tr"><style id="trava-lateral">html,body{max-width:100%;overflow-x:clip;overscroll-behavior-x:none}</style></head><body><div id="root"></div><script src="./app.js?v=mwv490tr"></script><script id="puxar-atualizar">/* 23/11/2026: puxar a tela para baixo atualiza o app (no iPhone, o app instalado não tinha isso) e aviso de versão nova */
(function(){var y0=null,dy=0,el=null,V=(document.querySelector('script[src*="app.js?v="]')||{}).src||'';
function bar(){if(el)return el;el=document.createElement('div');el.style.cssText='position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:99999;transform:translate(-50%,-80px);transition:transform .15s;padding:8px 14px;border-radius:20px;background:#ff8a2a;color:#1a1208;font:700 13px system-ui,sans-serif;box-shadow:0 6px 20px #0008;pointer-events:none';document.body.appendChild(el);return el}
function rolado(t){for(var n=t;n&&n!==document.body;n=n.parentElement){if(n.scrollTop>0)return true}return(window.scrollY||document.documentElement.scrollTop)>0}
addEventListener('touchstart',function(e){if(e.touches.length!==1||rolado(e.target)||document.querySelector('[role=dialog],.modal-backdrop')){y0=null;return}y0=e.touches[0].clientY;dy=0},{passive:true});
addEventListener('touchmove',function(e){if(y0===null)return;dy=e.touches[0].clientY-y0;if(dy<=0){if(el)el.style.transform='translate(-50%,-80px)';return}var b=bar();b.textContent=dy>110?'Solte para atualizar':'Puxe para atualizar';b.style.transform='translate(-50%,'+Math.min(dy*.4,40)+'px)'},{passive:true});
addEventListener('touchend',function(){if(y0!==null&&dy>110){bar().textContent='Atualizando…';setTimeout(function(){location.replace(location.pathname+'?r='+Date.now())},150)}else if(el)el.style.transform='translate(-50%,-80px)';y0=null;dy=0},{passive:true});
function confere(){fetch(location.pathname+'?chk='+Date.now(),{cache:'no-store'}).then(function(r){return r.text()}).then(function(h){var m=h.match(/app\.js\?v=([\w]+)/);if(m&&V&&V.indexOf(m[1])<0){var a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;if(document.querySelector('.modal,.modal-backdrop,[role=dialog],dialog[open],.overlay'))return;location.replace(location.pathname+'?v='+m[1])}}).catch(function(){})}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')confere()});setInterval(confere,120000);setTimeout(confere,4000)})();</script></body></html>
